[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "manuspectrum"
readme = "README.md"
authors = []
license = {text = "GNU AGPL3"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]
requires-python = ">=3.11"
dependencies = [
    "arches>=8.1.4,<8.2.0",
    "arches_querysets[drf]>=1.1.1,<1.2.0",
    "arches-vue-components>=2.0.2,<3.0.0",
    "arches-controlled-lists>=1.2.0,<1.3.0",
    # Imported by the project; floors from pip-audit (CVE-2026-41066 +
    # LP#2165901, CVE-2025-67221).
    "lxml>=6.1.3",
    "nh3>=0.3,<0.4",
    "orjson>=3.11.6",
    "zipstream-ng>=1.9,<2",
    "rispy>=0.10,<1",
    "bibtexparser>=2.0.1,<3",
    "defusedcsv>=3,<4",
    # Security floors inside the ranges arches allows (CVE-2026-15830,
    # CVE-2026-73228/73229, CVE-2026-45409). Drop a line once arches or
    # arches_querysets requires at least as much.
    "Django>=5.2.17",
    "djangorestframework>=3.17.2",
    "idna>=3.15",
]
version = "1.0.0a0"

[dependency-groups]
dev = [
    "livereload",
    "coverage",
    "django-silk==5.1.0",
    "pre-commit==3.8.0",
    "black==26.3.1",
    "jsonschema>=4.26,<5",
    "PyLD>=1.0.5,<2",
]
prod = [
    "gunicorn>=26.2,<27",
    # redis-py: the Celery broker (kombu) and Django's RedisCache, both on the
    # Redis containers of the Compose stack. kombu's extra bounds its version.
    "kombu[redis]",
]

[tool.setuptools]
packages = ["manuspectrum"]
