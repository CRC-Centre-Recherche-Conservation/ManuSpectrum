[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "manuspectrum"
readme = "README.md"
authors = []
license = "AGPL-3.0-only"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]
requires-python = ">=3.11"
dependencies = [
    "arches>=8.1.4,<8.2.0",
    "arches_querysets[drf]>=1.1.1,<1.2.0",
    "arches-vue-components>=2.0.2,<3.0.0",
    "arches-controlled-lists>=1.2.0,<1.3.0",
    # Imported by the project; floors from pip-audit (CVE-2026-41066 +
    # LP#2165901, CVE-2025-67221).
    "lxml>=6.1.3",
    "nh3>=0.3,<0.4",
    "orjson>=3.11.6",
    "zipstream-ng>=1.9,<2",
    "rispy>=0.10,<1",
    "bibtexparser>=2.0.1,<3",
    "defusedcsv>=3,<4",
    # Observability (spec observability §4): /metrics and its multiprocess
    # registry under gunicorn and Celery, JSON logs.
    "django-prometheus>=2.5,<2.6",
    "prometheus-client>=0.22,<1",
    "python-json-logger>=4.2,<5",
    # Accounts hardening (PP-4): sign-in lockout and login records; Argon2
    # for Django's PasswordHasher. The "argon2$" hashes in auth_user need it:
    # keep it while one is stored (settings.PASSWORD_HASHERS).
    "django-axes>=8.3.1,<9",
    "argon2-cffi>=25.1,<26",
    # Security floors inside the ranges arches allows (CVE-2026-15830,
    # CVE-2026-73228/73229, CVE-2026-45409). Drop a line once arches or
    # arches_querysets requires at least as much.
    "Django>=5.2.17",
    "djangorestframework>=3.17.2",
    "idna>=3.15",
]
version = "1.0.0a0"

[dependency-groups]
dev = [
    "livereload",
    "coverage",
    "django-silk==5.6.0",
    "pre-commit==3.8.0",
    "black==26.10.1",
    "jsonschema>=4.26,<5",
    "PyLD>=1.0.5,<2",
]
prod = [
    "gunicorn>=26.2,<27",
    # redis-py: the Celery broker (kombu) and Django's RedisCache, both on the
    # Redis containers of the Compose stack. kombu's extra bounds its version.
    "kombu[redis]",
]

[tool.setuptools]
packages = ["manuspectrum"]
