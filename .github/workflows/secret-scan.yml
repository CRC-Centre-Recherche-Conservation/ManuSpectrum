name: secret-scan

# Scans the whole repository for secrets on every pull request: the files Git
# tracks, then every commit of the pull request, so a secret added and removed
# inside it is still found. One pinned gitleaks image behind
# deploy/scripts/gitleaks.sh, the same entry point as the pre-commit hook. No
# `paths:` filter: a secret can land in any file.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whole tree
        run: bash deploy/scripts/gitleaks.sh tree

      - name: Commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash deploy/scripts/gitleaks.sh range "$BASE_SHA" "$HEAD_SHA"

      - name: Whole history
        if: github.event_name == 'workflow_dispatch'
        run: bash deploy/scripts/gitleaks.sh history

      - name: Install pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip install pre-commit==4.6.2
          echo "$RUNNER_TEMP/pre-commit/bin" >> "$GITHUB_PATH"

      - name: Hook tests
        env:
          REQUIRE_PRE_COMMIT: "1"
        run: bash deploy/scripts/tests/test_gitleaks.sh
