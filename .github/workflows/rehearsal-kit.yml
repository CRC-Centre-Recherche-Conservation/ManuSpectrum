name: rehearsal-kit

# Runs the offline checks of the rehearsal VM kit (deploy/rehearsal/check.sh).
# No `paths:` filter, so the check can be required: the `changes` job decides
# whether the kit is touched and the `check` job is skipped otherwise.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rehearsal-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    outputs:
      rehearsal: ${{ steps.filter.outputs.rehearsal }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect kit changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "rehearsal=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -Eq '^(deploy/rehearsal/|\.github/workflows/rehearsal-kit\.yml$)'; then
            echo "rehearsal=true" >> "$GITHUB_OUTPUT"
          else
            echo "rehearsal=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.rehearsal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      # check.sh looks for jsonschema in ../venv relative to the repository root.
      - name: Install the schema validator
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/../venv"
          "$GITHUB_WORKSPACE/../venv/bin/python" -m pip install jsonschema==4.26.0 PyYAML==6.0.3

      - name: Check the rehearsal kit
        run: bash deploy/rehearsal/check.sh
