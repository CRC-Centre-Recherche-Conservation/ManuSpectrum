name: staging

# Builds the application image once, proves it, and publishes that same image
# to GHCR as sha-<full commit>. release.yml later promotes this digest to a
# version tag; it never rebuilds.
#
# main (push): the image builds from scratch (no cache in, none out, so it
# carries the day's Debian security updates), stack-proof.yml runs the whole
# stack on the loaded image, then the image is pushed and its build provenance
# attested (release.yml checks it before promoting the digest).
# Manual run on the integration branch: the same, with the buildkit cache read.
# Push to the integration branch: cache warm-up and probe only, nothing is
# published. Every pull request that targets the branch reads that cache
# (scope `image`, stored under the branch's own ref).
on:
  push:
    branches:
      # The integration branch (one line to add when `dev` takes the role, PP-0).
      - dev
      - main
  workflow_dispatch:

# actions: read lets buildkit's cache exporter list the existing cache
# entries (GET /actions/caches) instead of logging an error and probing each
# blob one by one.
permissions:
  contents: read
  actions: read

# Runs on main and manual runs neither cancel nor replace each other: GitHub
# keeps one pending run per group and drops the older queued ones, so each of
# them gets a group of its own (the run id) and every merge publishes its own
# commit. Only a push elsewhere (the warm-cache runs) is cancelled by a newer
# push.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && format('staging-run-{0}', github.run_id) || format('staging-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/crc-centre-recherche-conservation/manuspectrum

jobs:
  warm-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      IMAGE: manuspectrum:ci
    steps:
      # No submodule: the build context never holds pkg (.dockerignore allowlist).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (integration cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Probe the image
        run: bash deploy/docker/probe-image.sh "$IMAGE" "$GITHUB_SHA"

  build:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      IMAGE: manuspectrum:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (integration cache, read only)
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image

      - name: Build the image (from scratch)
        if: github.ref != 'refs/heads/dev'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          no-cache: true

      - name: Save the image
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker save "$IMAGE" --output "$RUNNER_TEMP/image/image.tar"
          du -h "$RUNNER_TEMP/image/image.tar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-image
          path: ${{ runner.temp }}/image/image.tar
          retention-days: 1
          # The layers inside the archive are already compressed.
          compression-level: 1
          if-no-files-found: error

  proof:
    needs: build
    uses: ./.github/workflows/stack-proof.yml
    with:
      git-sha: ${{ github.sha }}
      image-artifact: staging-image

  publish:
    needs: [build, proof]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      IMAGE: manuspectrum:ci
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-image
          path: ${{ runner.temp }}/image

      # The scripts come from the commit being published; no submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the proven image as sha-<commit>
        id: push
        run: |
          docker load --input "$RUNNER_TEMP/image/image.tar"
          ref="$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag "$IMAGE" "$ref"
          docker push "$ref"
          digest="$(bash deploy/scripts/image-digest.sh "$ref")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging image"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tag: \`sha-$GITHUB_SHA\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The build provenance of the pushed digest: release.yml's promote job
      # verifies it (workflow staging.yml, branch main for a final tag, the
      # integration branch for a candidate) before giving the digest a version
      # tag, so an image built from another branch is never released as final.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
