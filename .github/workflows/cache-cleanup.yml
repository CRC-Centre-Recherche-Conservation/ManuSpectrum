name: cache-cleanup

# Deletes the Actions caches of a pull request when it closes. The image build
# of deploy-lint.yml writes its buildkit cache under refs/pull/<n>/merge, a
# scope no other pull request reads, and the repository cache quota is 10 GB.
on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    # A pull request from a fork runs with a read-only token and wrote no cache here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Delete the caches of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache delete --all --ref "$REF" --repo "$REPO" --succeed-on-no-caches
