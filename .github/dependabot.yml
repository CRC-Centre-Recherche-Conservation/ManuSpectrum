version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - dependencies
      - javascript
    versioning-strategy: "increase"
    target-branch: "dev"
    # A new release waits a week before its pull request: a hijacked package
    # version is usually caught and pulled within days. Security updates do
    # not wait.
    cooldown:
      default-days: 7
    # The packages Arches pins exactly (its `dependencies` and its
    # `peerDependencies`) and the project follows at the same version: they
    # move with an Arches upgrade. The list is kept equal to that set by
    # tests/test_arches_pins.py.
    ignore:
      - dependency-name: "babel-loader"
      - dependency-name: "@babel/plugin-syntax-dynamic-import"
      - dependency-name: "@babel/plugin-transform-class-properties"
      - dependency-name: "@babel/plugin-transform-runtime"
      - dependency-name: "@babel/preset-env"
      - dependency-name: "clean-webpack-plugin"
      - dependency-name: "cross-env"
      - dependency-name: "cross-fetch"
      - dependency-name: "css-loader"
      - dependency-name: "dompurify"
      - dependency-name: "es-toolkit"
      - dependency-name: "eslint"
      - dependency-name: "eslint-config-prettier"
      - dependency-name: "eslint-plugin-vue"
      - dependency-name: "@eslint/js"
      - dependency-name: "globals"
      - dependency-name: "jsdom"
      - dependency-name: "leaflet"
      - dependency-name: "leaflet-iiif"
      - dependency-name: "maplibre-gl"
      - dependency-name: "mini-css-extract-plugin"
      - dependency-name: "nodemon"
      - dependency-name: "openvue"
      - dependency-name: "@openvue/themes"
      - dependency-name: "pinia"
      - dependency-name: "postcss"
      - dependency-name: "postcss-loader"
      - dependency-name: "prettier"
      - dependency-name: "primeicons"
      - dependency-name: "sass"
      - dependency-name: "sass-loader"
      - dependency-name: "style-loader"
      - dependency-name: "stylelint"
      - dependency-name: "stylelint-config-standard"
      - dependency-name: "stylelint-webpack-plugin"
      - dependency-name: "ts-loader"
      - dependency-name: "@types/codemirror"
      - dependency-name: "@types/geojson"
      - dependency-name: "@types/js-cookie"
      - dependency-name: "typescript"
      - dependency-name: "typescript-eslint"
      - dependency-name: "@typescript-eslint/parser"
      - dependency-name: "@vitejs/plugin-vue"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
      - dependency-name: "vue-loader"
      - dependency-name: "vue-tsc"
      - dependency-name: "@vue/test-utils"
      - dependency-name: "webpack"
      - dependency-name: "webpack-cli"
      - dependency-name: "webpack-merge"
      # Major only: the expression evaluator the map tests use must stay on
      # the style-spec major that maplibre-gl bundles (26 for maplibre-gl 6).
      - dependency-name: "@maplibre/maplibre-gl-style-spec"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Base image digests of deploy/docker/Dockerfile: a rebuilt python or node
  # image carries the Debian security updates, so no cooldown. Only new
  # digests of the same tags: Python moves with Arches, Node stays on its LTS
  # major, and uv moves by hand with deploy/check-stack.sh.
  - package-ecosystem: "docker" # zizmor: ignore[dependabot-cooldown]
    directory: "/deploy/docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "wednesday"
    labels:
      - dependencies
      - docker
    target-branch: "dev"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*astral-sh/uv"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  # Compose service images, pinned by digest.
  - package-ecosystem: "docker-compose" # zizmor: ignore[dependabot-cooldown]
    directory: "/deploy/compose"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "thursday"
    labels:
      - dependencies
      - docker
    target-branch: "dev"
    groups:
      compose-images:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "tuesday"
    labels:
      - dependencies
      - python
    target-branch: "dev"
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
    ignore:
      # Arches core upgrades are manual (updateproject rebuilds webpack/), and
      # the npm side moves with them. Arches applications stay free.
      - dependency-name: "arches"
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
