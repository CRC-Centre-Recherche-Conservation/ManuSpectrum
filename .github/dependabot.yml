version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - dependencies
      - javascript
    versioning-strategy: "increase"
    target-branch: "dev"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Base image digests of deploy/docker/Dockerfile: a rebuilt python or node
  # image carries the Debian security updates.
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "wednesday"
    labels:
      - dependencies
      - docker
    target-branch: "dev"
  # Compose service images, pinned by digest.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "thursday"
    labels:
      - dependencies
      - docker
    target-branch: "dev"
    groups:
      compose-images:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "tuesday"
    labels:
      - dependencies
      - python
    target-branch: "dev"
    versioning-strategy: "lockfile-only"
    ignore:
      # Arches minor upgrades are manual (updateproject rebuilds webpack/).
      - dependency-name: "arches*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
