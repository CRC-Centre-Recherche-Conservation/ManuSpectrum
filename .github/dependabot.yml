version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - dependencies
      - javascript
    versioning-strategy: "increase"
    target-branch: "dev"
    # A new release waits a week before its pull request: a hijacked package
    # version is usually caught and pulled within days. Security updates do
    # not wait.
    cooldown:
      default-days: 7
    # The packages Arches pins exactly and the project follows at the same
    # version: they move with an Arches upgrade. The list is kept equal to
    # that set by tests/test_arches_pins.py.
    ignore:
      - dependency-name: "leaflet"
      - dependency-name: "leaflet-iiif"
      - dependency-name: "primeicons"
      - dependency-name: "primevue"
      - dependency-name: "typescript"
      # Major only: the expression evaluator the map tests use must stay on
      # the style-spec major that maplibre-gl bundles (20 for maplibre-gl 4).
      - dependency-name: "@maplibre/maplibre-gl-style-spec"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Base image digests of deploy/docker/Dockerfile: a rebuilt python or node
  # image carries the Debian security updates, so no cooldown.
  - package-ecosystem: "docker" # zizmor: ignore[dependabot-cooldown]
    directory: "/deploy/docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "wednesday"
    labels:
      - dependencies
      - docker
    target-branch: "dev"
  # Compose service images, pinned by digest.
  - package-ecosystem: "docker-compose" # zizmor: ignore[dependabot-cooldown]
    directory: "/deploy/compose"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "thursday"
    labels:
      - dependencies
      - docker
    target-branch: "dev"
    groups:
      compose-images:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "tuesday"
    labels:
      - dependencies
      - python
    target-branch: "dev"
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
    ignore:
      # Arches core upgrades are manual (updateproject rebuilds webpack/), and
      # the npm side moves with them. Arches applications stay free.
      - dependency-name: "arches"
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
