<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1321"/>
      <stop offset="100%" style="stop-color:#1b2438"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>

  <!-- Manuscript page — parchment-like rectangle -->
  <rect x="120" y="60" width="520" height="680" rx="6" fill="#1e2840" stroke="#c8a951" stroke-width="0.8" opacity="0.5"/>
  <!-- Text lines -->
  <g opacity="0.12" fill="#c8a951">
    <rect x="155" y="110" width="340" height="3" rx="1"/>
    <rect x="155" y="135" width="420" height="3" rx="1"/>
    <rect x="155" y="160" width="380" height="3" rx="1"/>
    <rect x="155" y="185" width="300" height="3" rx="1"/>
    <rect x="155" y="220" width="410" height="3" rx="1"/>
    <rect x="155" y="245" width="360" height="3" rx="1"/>
    <rect x="155" y="270" width="430" height="3" rx="1"/>
    <rect x="155" y="295" width="350" height="3" rx="1"/>
    <rect x="155" y="330" width="390" height="3" rx="1"/>
    <rect x="155" y="355" width="420" height="3" rx="1"/>
    <rect x="155" y="380" width="310" height="3" rx="1"/>
    <rect x="155" y="415" width="400" height="3" rx="1"/>
    <rect x="155" y="440" width="370" height="3" rx="1"/>
    <rect x="155" y="465" width="440" height="3" rx="1"/>
    <rect x="155" y="500" width="330" height="3" rx="1"/>
    <rect x="155" y="525" width="410" height="3" rx="1"/>
    <rect x="155" y="550" width="360" height="3" rx="1"/>
    <rect x="155" y="585" width="420" height="3" rx="1"/>
    <rect x="155" y="610" width="290" height="3" rx="1"/>
    <rect x="155" y="645" width="380" height="3" rx="1"/>
    <rect x="155" y="670" width="350" height="3" rx="1"/>
  </g>

  <!-- Erased zone — faintly visible under UV -->
  <rect x="180" y="390" width="280" height="65" rx="4" fill="#9b59b6" opacity="0.06"/>
  <rect x="180" y="390" width="280" height="65" rx="4" fill="none" stroke="#9b59b6" stroke-width="1" stroke-dasharray="4 3" opacity="0.25"/>
  <text x="320" y="428" text-anchor="middle" fill="#9b59b6" font-family="sans-serif" font-size="11" letter-spacing="1.5" opacity="0.4">ERASED TEXT — UV REVEALED</text>

  <!-- Spectral layer stack (right side) — representing different wavelength bands -->
  <g transform="translate(700, 100)">
    <!-- VIS layer -->
    <rect x="0" y="0" width="400" height="105" rx="8" fill="#3498db" opacity="0.12" stroke="#3498db" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="25" fill="#3498db" font-family="sans-serif" font-size="12" letter-spacing="2" opacity="0.7">VIS — 400-700 nm</text>
    <rect x="20" y="40" width="360" height="50" rx="4" fill="#3498db" opacity="0.06"/>
    <g opacity="0.15" fill="#3498db">
      <rect x="30" y="50" width="200" height="2" rx="1"/>
      <rect x="30" y="62" width="280" height="2" rx="1"/>
      <rect x="30" y="74" width="240" height="2" rx="1"/>
    </g>

    <!-- UV layer -->
    <rect x="15" y="125" width="400" height="105" rx="8" fill="#9b59b6" opacity="0.12" stroke="#9b59b6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="35" y="150" fill="#9b59b6" font-family="sans-serif" font-size="12" letter-spacing="2" opacity="0.7">UV — 300-400 nm</text>
    <rect x="35" y="165" width="360" height="50" rx="4" fill="#9b59b6" opacity="0.06"/>
    <g opacity="0.15" fill="#9b59b6">
      <rect x="45" y="175" width="180" height="2" rx="1"/>
      <rect x="45" y="187" width="300" height="2" rx="1"/>
      <rect x="45" y="199" width="250" height="2" rx="1"/>
    </g>

    <!-- NIR layer -->
    <rect x="30" y="250" width="400" height="105" rx="8" fill="#e74c3c" opacity="0.12" stroke="#e74c3c" stroke-width="1" stroke-opacity="0.3"/>
    <text x="50" y="275" fill="#e74c3c" font-family="sans-serif" font-size="12" letter-spacing="2" opacity="0.7">NIR — 700-1000 nm</text>
    <rect x="50" y="290" width="360" height="50" rx="4" fill="#e74c3c" opacity="0.06"/>
    <g opacity="0.15" fill="#e74c3c">
      <rect x="60" y="300" width="260" height="2" rx="1"/>
      <rect x="60" y="312" width="310" height="2" rx="1"/>
      <rect x="60" y="324" width="220" height="2" rx="1"/>
    </g>

    <!-- SWIR layer -->
    <rect x="45" y="375" width="400" height="105" rx="8" fill="#f39c12" opacity="0.12" stroke="#f39c12" stroke-width="1" stroke-opacity="0.3"/>
    <text x="65" y="400" fill="#f39c12" font-family="sans-serif" font-size="12" letter-spacing="2" opacity="0.7">SWIR — 1000-2500 nm</text>
    <rect x="65" y="415" width="360" height="50" rx="4" fill="#f39c12" opacity="0.06"/>
    <g opacity="0.15" fill="#f39c12">
      <rect x="75" y="425" width="230" height="2" rx="1"/>
      <rect x="75" y="437" width="290" height="2" rx="1"/>
      <rect x="75" y="449" width="210" height="2" rx="1"/>
    </g>
  </g>

  <!-- Connecting lines from manuscript to layers -->
  <line x1="580" y1="200" x2="700" y2="152" stroke="#3498db" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="560" y1="350" x2="715" y2="277" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="540" y1="500" x2="730" y2="402" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="520" y1="620" x2="745" y2="527" stroke="#f39c12" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.3"/>

  <!-- Label -->
  <text x="600" y="760" text-anchor="middle" fill="#8b8d9e" font-family="sans-serif" font-size="18" letter-spacing="3">IMAGERIE MULTISPECTRALE — PLACEHOLDER</text>
</svg>
