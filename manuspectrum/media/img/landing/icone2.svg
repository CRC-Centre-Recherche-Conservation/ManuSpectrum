<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1020"/>
      <stop offset="100%" style="stop-color:#151d33"/>
    </linearGradient>
    <linearGradient id="multi" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <!-- Multispectral layers -->
  <g opacity="0.25">
    <rect x="200" y="120" width="800" height="500" rx="8" fill="#e74c3c" transform="rotate(-2 600 370)"/>
    <rect x="200" y="120" width="800" height="500" rx="8" fill="#2ecc71" transform="rotate(0 600 370)" opacity="0.7"/>
    <rect x="200" y="120" width="800" height="500" rx="8" fill="#3498db" transform="rotate(2 600 370)" opacity="0.5"/>
  </g>
  <!-- Wavelength indicators -->
  <g fill="none" stroke-width="1.5" opacity="0.5">
    <path d="M150 650 Q300 600 450 650 Q600 700 750 650 Q900 600 1050 650" stroke="#e74c3c"/>
    <path d="M150 670 Q300 620 450 670 Q600 720 750 670 Q900 620 1050 670" stroke="#2ecc71"/>
    <path d="M150 690 Q300 640 450 690 Q600 740 750 690 Q900 640 1050 690" stroke="#3498db"/>
  </g>
  <text x="600" y="760" text-anchor="middle" fill="#8b8d9e" font-family="sans-serif" font-size="18" letter-spacing="3">IMAGERIE MULTISPECTRALE — PLACEHOLDER</text>
</svg>