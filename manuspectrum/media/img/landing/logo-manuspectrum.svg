<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 95">
  <defs>
    <linearGradient id="spectral-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc3545"/>
      <stop offset="20%" stop-color="#e67e22"/>
      <stop offset="40%" stop-color="#f0b429"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow-blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glow-red" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc3545" stop-opacity="0"/>
      <stop offset="100%" stop-color="#dc3545" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <!-- "MANU" text (drawn first, curves will overlay) -->
  <text x="124" y="65" fill="#1a1a2e" font-family="Georgia, 'Cormorant Garamond', serif" font-size="44" font-weight="300" letter-spacing="5">MANU</text>

  <!-- Peak 1 (blue) — flat under MANU, rise starts after U, ends above PE -->
  <path d="M 132,81 C 262,81 276,80 286,72 C 300,42 316,6 340,6 C 348,6 372,30 438,28 L 132,81 Z" fill="url(#glow-blue)"/>
  <path d="M 132,81 C 262,81 276,80 286,72 C 300,42 316,6 340,6 C 348,6 372,30 438,28"
        fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Peak 2 (red) — flat under MANU, rise starts after U, ends above PE -->
  <path d="M 142,81 C 266,81 281,79 294,68 C 312,38 332,10 357,10 C 365,10 389,32 444,30 L 142,81 Z" fill="url(#glow-red)"/>
  <path d="M 142,81 C 266,81 281,79 294,68 C 312,38 332,10 357,10 C 365,10 389,32 444,30"
        fill="none" stroke="#dc3545" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- "PECTRUM" text (drawn last, overlays descending curves) -->
  <text x="379" y="65" fill="#1a1a2e" font-family="Georgia, 'Cormorant Garamond', serif" font-size="44" font-weight="300" letter-spacing="5">PECTRUM</text>

  <!-- Spectral bar -->
  <rect x="40" y="82" width="620" height="3" rx="1.5" fill="url(#spectral-bar)"/>
</svg>
