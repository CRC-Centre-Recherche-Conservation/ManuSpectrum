<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="spectral-logo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="20%" style="stop-color:#e67e22"/>
      <stop offset="40%" style="stop-color:#f1c40f"/>
      <stop offset="60%" style="stop-color:#2ecc71"/>
      <stop offset="80%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
  </defs>
  <!-- Spectral bar -->
  <rect x="30" y="85" width="340" height="3" rx="1.5" fill="url(#spectral-logo)"/>
  <!-- Logo text -->
  <text x="200" y="70" text-anchor="middle" fill="#e6e4e0" font-family="Georgia, 'Cormorant Garamond', serif" font-size="42" font-weight="300" letter-spacing="6">MANUSPECTRUM</text>
</svg>