{% for technique in techniques %}
<li class="ms-technique-item{% if technique.children %} ms-technique-branch{% endif %}">
    <a class="ms-search-chip ms-technique-chip" lang="{{ technique.label.lang }}" href="{% url 'analysis-explorer' %}?grain=analyses&amp;technique={{ technique.id|urlencode:'' }}">{{ technique.label.value }}</a>
    {% if technique.children %}
    <ul class="ms-technique-narrower" role="list">
        {% include "includes/ms_technique_items.htm" with techniques=technique.children %}
    </ul>
    {% endif %}
</li>
{% endfor %}
