<script>
(function () {
    var box = document.querySelector("[data-ms-copy-key]");
    if (!box) return;
    var button = box.querySelector(".ms-mfa-key__copy");
    var status = box.querySelector(".ms-mfa-key__status");
    var value = box.querySelector(".ms-mfa-key__value");
    var key = box.getAttribute("data-ms-copy-key");
    var timer;
    function done() {
        status.textContent = button.getAttribute("data-copied");
        clearTimeout(timer);
        timer = setTimeout(function () { status.textContent = ""; }, 2500);
    }
    function select() {
        var range = document.createRange();
        range.selectNodeContents(value);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }
    button.hidden = false;
    button.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(key).then(done, select);
        } else {
            select();
        }
    });
})();
</script>
