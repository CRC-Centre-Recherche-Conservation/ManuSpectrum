{% load i18n %}
{% trans "No description" as noDescription %}

<div class="object-search-step">
    <div class="workflow-search-panel">
        <div class="search-bar">
            <select data-bind="select2Query: {select2Config: targetResourceSelectConfig}"></select>
        </div>
        <div class="workflow-search-count">
            <div class="count-number" data-bind="text: totalResults()"></div>
            <div>{% trans "Documents" %}</div>
        </div>
        <div class="flex-1"></div>
        <div data-bind="component:{
            name: 'resource-instance-creator',
            params: {
                graphids: [
                    documentGraphId,
                ],
                value: newResourceInstance,
                disabled: locked,
            }
        }"></div>
    </div>
    <div class="workflow-search-results">
        <div class="workflow-search-results-full-container">
            <div class="workflow-search-list-container">
                <div class="workflow-search-list">
                    <div data-bind="css: {'loading-mask': reportDataLoading}">
                        <div class="afs-project-search-result-details-container" data-bind="foreach: targetResources">
                            <div class="search-result-item" data-bind="css: {'selected-instance': $parent.value().findIndex(
                                res => res.resourceinstanceid === $data.resourceinstanceid) >= 0},
                            click: function(){$parent.updateTileData($data)}">
                                <div class="summary-report-title" data-bind="text: $parent.getStringValue($data.displayname)"></div>
                                <div class="summary-report-description" data-bind="text: $parent.stripTags($parent.getStringValue($data.displaydescription)) || '{{ noDescription|escapejs }}'"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-results-footer">
                    <div class="w-100">
                        <div data-bind="component: {
                            name: 'paging-filter',
                            params: {
                                query,
                                searchResults,
                                filters,
                                searchFilterVms
                            }
                        }"></div>
                    </div>
                </div>
            </div>

            <div class="wf-multi-tile-step-list">
                <div class="wf-multi-tile-step-list-header ms-cart-header">
                    <h5>{% trans "Selected Documents" %}</h5>
                    <span class="ms-autosave-status small" role="status" aria-live="polite">
                        <!-- ko if: saveState() === 'saving' -->
                        <span class="text-muted"><i class="fa fa-spinner fa-spin" aria-hidden="true"></i> {% trans "Saving…" %}</span>
                        <!-- /ko -->
                        <!-- ko if: saveState() === 'saved' -->
                        <span class="text-success"><i class="fa fa-check" aria-hidden="true"></i> {% trans "Saved" %}</span>
                        <!-- /ko -->
                        <!-- ko if: saveState() === 'error' -->
                        <span class="text-danger" role="alert">
                            <i class="fa fa-exclamation-triangle" aria-hidden="true"></i> {% trans "Save failed." %}
                            <button type="button" class="btn btn-xs btn-link ms-btn-inline" data-bind="click: retrySave">{% trans "Retry" %}</button>
                        </span>
                        <!-- /ko -->
                    </span>
                    <button type="button" class="btn btn-xs btn-link ms-btn-inline" data-bind="visible: selectedResources().length > 0, click: removeAll">
                        <i class="fa fa-times-circle" aria-hidden="true"></i> {% trans "Remove all" %}
                    </button>
                </div>
                <div class="wf-multi-tile-step-list-body">
                    <!-- ko if: selectedResources().length === 0 -->
                    <div class="wf-multi-tile-step-list-empty">
                        <p>{% trans "You have not added any Documents to this Project" %}</p>
                    </div>
                    <!--/ko -->
                    <!-- ko foreach: selectedResources -->
                    <div class="wf-multi-tile-step-card">
                        <div class="wf-multi-tile-card-info">
                            <div class="wf-multi-tile-card-info-details">
                                <dt data-bind="text: $parent.getStringValue($data.displayname)"></dt>
                                <dd>
                                    <span data-bind="text: $parent.stripTags($parent.getStringValue($data.displaydescription)) || '{{ noDescription|escapejs }}'"></span>
                                </dd>
                            </div>
                        </div>
                        <div class="wf-multi-tile-step-card-controls">
                            <span data-bind="click: function(){$parent.updateTileData($data)}">
                                <span><i class="fa fa-times-circle" aria-hidden="true"></i></span>
                                <span data-bind="text: $root.translations.remove"></span>
                            </span>
                        </div>
                    </div>
                    <!-- /ko -->
                </div>
            </div>
        </div>
    </div>
</div>
