{% load i18n %}

<div class="biblissima-config-step" style="padding: 20px; max-width: 700px;">

    <div class="form-group">
        <label class="control-label">{% trans "Resource type to create" %}</label>
        <div class="radio-row">
            <label class="radio-inline">
                <input type="radio" name="resourceType" value="Document"
                       data-bind="checked: resourceType">
                {% trans "Document" %}
            </label>
            <label class="radio-inline">
                <input type="radio" name="resourceType" value="Component"
                       data-bind="checked: resourceType">
                {% trans "Component" %}
            </label>
        </div>
    </div>

    <!-- ko if: isComponent -->
    <div class="form-group">
        <label class="control-label">
            {% trans "Parent document" %} <span class="text-danger">*</span>
        </label>
        <p class="help-block text-muted">
            {% trans "The document this component belongs to. Must already exist." %}
        </p>
        <select style="width: 100%;"
            data-bind="select2Query: { select2Config: parentDocPicker.select2Config }">
        </select>
    </div>
    <!-- /ko -->

    <div class="form-group">
        <label class="control-label">{% trans "Associate with project" %}</label>
        <p class="help-block text-muted">
            {% trans "Optional. Created resources will be added to this project's studied objects." %}
        </p>
        <select style="width: 100%;"
            data-bind="select2Query: { select2Config: projectPicker.select2Config }">
        </select>
    </div>

    <div class="form-group">
        <label class="control-label">{% trans "Default type" %}</label>
        <p class="help-block text-muted">
            {% trans "Type applied by default to all created resources. Can be changed per item later." %}
        </p>
        <div data-bind="component: {
            name: 'concept-select-widget',
            params: {
                node: {config: {rdmCollection: currentRdmCollection}},
                config: {label: '', placeholder: ''},
                renderContext: 'workflow',
                value: defaultType,
            }
        }"></div>
    </div>

    <div class="form-group" style="margin-top: 24px;">
        <button class="btn btn-md btn-mint"
                data-bind="click: submit, disable: !canProceed()">
            {% trans "Continue" %}
        </button>
    </div>

</div>
