{% extends "views/components/widgets/file.htm" %}
{% load i18n %}

{% block report %}
{{ block.super }}

<!-- XY Unified Chart (only rendered by the first widget instance / chart host) -->
<!-- ko if: isChartHost() && xyFileEntries().length > 0 -->
<dd class="report-xy-unified-container">

    <!-- File dropdown (only if 2+ files) -->
    <!-- ko if: showFileDropdown() -->
    <div class="xy-file-dropdown" data-bind="css: { open: dropdownOpen() }">
        <button type="button" class="btn btn-default btn-sm xy-file-dropdown-toggle"
                data-bind="click: toggleDropdown">
            <i class="fa fa-layer-group"></i>
            {% trans "Files" %}: <span data-bind="text: selectedCount()"></span>/<span data-bind="text: xyFileEntries().length"></span>
            <span class="caret"></span>
        </button>
        <!-- ko if: dropdownOpen() -->
        <div class="xy-file-dropdown-menu">
            <div class="xy-file-dropdown-actions">
                <a href="javascript:void(0)" data-bind="click: selectAll">{% trans "Select all" %}</a>
                <span class="xy-file-dropdown-sep">|</span>
                <a href="javascript:void(0)" data-bind="click: deselectAll">{% trans "Deselect all" %}</a>
            </div>
            <!-- ko foreach: xyFileEntries() -->
            <label class="xy-file-dropdown-item">
                <input type="checkbox" data-bind="checked: selected">
                <span class="xy-file-color-dot" data-bind="style: { backgroundColor: $parent.getFileColor(colorIndex) }"></span>
                <span class="xy-file-name" data-bind="text: fileName"></span>
                <!-- ko if: loading() -->
                <i class="fa fa-spinner fa-spin xy-file-status-icon"></i>
                <!-- /ko -->
                <!-- ko if: error() && !loading() -->
                <i class="fa fa-exclamation-triangle xy-file-status-icon xy-file-status-warning" title="" data-bind="attr: { title: error() }"></i>
                <!-- /ko -->
            </label>
            <!-- /ko -->
        </div>
        <!-- /ko -->
    </div>
    <!-- /ko -->

    <!-- Loading state -->
    <!-- ko if: allLoading() -->
    <div class="report-xy-chart-loading">
        <i class="fa fa-spinner fa-spin"></i>
        <span>{% trans "Loading charts..." %}</span>
    </div>
    <!-- /ko -->

    <!-- Global error (all entries have errors, none loading) -->
    <!-- ko if: !allLoading() && xyFileEntries().length > 0 && !hasChartData() && anyError() -->
    <div class="report-xy-chart-error">
        <i class="fa fa-exclamation-triangle"></i>
        <span>{% trans "Unable to load chart data" %}</span>
    </div>
    <!-- /ko -->

    <!-- No files selected message -->
    <!-- ko if: noFilesSelected() -->
    <div class="report-xy-no-selection">
        <i class="fa fa-info-circle"></i>
        <span>{% trans "Select files to display" %}</span>
    </div>
    <!-- /ko -->

    <!-- Unified chart -->
    <!-- ko if: !allLoading() && hasChartData() && !noFilesSelected() -->
    <div class="report-xy-chart" data-bind='plotly: {
        traces: unifiedChartData,
        title: chartTitle,
        titleSize: chartTitleSize,
        xAxisLabel: chartXAxisLabel,
        xAxisLabelSize: chartXAxisLabelSize,
        yAxisLabel: chartYAxisLabel,
        yAxisLabelSize: chartYAxisLabelSize
    }'></div>
    <!-- /ko -->

</dd>
<!-- /ko -->

<style>
.rp-report-tile:has(.report-xy-unified-container) {
    flex: 1;
    min-width: 0;
}

.report-xy-unified-container {
    margin-left: 0 !important;
    clear: both;
    padding: 10px 0;
    position: relative;
}

.report-xy-chart-loading {
    padding: 20px;
    text-align: center;
    color: #999;
}

.report-xy-chart-loading i {
    margin-right: 5px;
}

.report-xy-chart-error {
    padding: 10px 15px;
    margin: 5px 0;
    background-color: #fef0ef;
    border: 1px solid #f5c6cb;
    border-radius: 4px;
    color: #721c24;
}

.report-xy-chart-error i {
    margin-right: 5px;
    color: #dc3545;
}

.report-xy-no-selection {
    padding: 20px;
    text-align: center;
    color: #999;
}

.report-xy-no-selection i {
    margin-right: 5px;
}

.report-xy-chart {
    width: 100%;
    min-height: 400px;
}

/* Dropdown */
.xy-file-dropdown {
    display: flex;
    justify-content: flex-end;
    position: relative;
    z-index: 10;
    margin-bottom: 4px;
}

.xy-file-dropdown-toggle {
    font-size: 12px;
}

.xy-file-dropdown-toggle i {
    margin-right: 3px;
}

.xy-file-dropdown-menu {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 2px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.175);
    min-width: 220px;
    max-height: 300px;
    overflow-y: auto;
    padding: 5px 0;
}

.xy-file-dropdown-actions {
    padding: 4px 12px 6px;
    border-bottom: 1px solid #eee;
    font-size: 12px;
}

.xy-file-dropdown-actions a {
    cursor: pointer;
    color: #337ab7;
}

.xy-file-dropdown-actions a:hover {
    text-decoration: underline;
}

.xy-file-dropdown-sep {
    margin: 0 6px;
    color: #ccc;
}

.xy-file-dropdown-item {
    display: flex;
    align-items: center;
    padding: 4px 12px;
    margin: 0;
    font-weight: normal;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
}

.xy-file-dropdown-item:hover {
    background-color: #f5f5f5;
}

.xy-file-dropdown-item input[type="checkbox"] {
    margin: 0 6px 0 0;
    flex-shrink: 0;
}

.xy-file-color-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    flex-shrink: 0;
}

.xy-file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
}

.xy-file-status-icon {
    margin-left: 6px;
    font-size: 11px;
    color: #999;
    flex-shrink: 0;
}

.xy-file-status-warning {
    color: #dc3545;
}
</style>
{% endblock report %}
