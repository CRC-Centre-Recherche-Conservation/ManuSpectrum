<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>ManuSpectrum</title>
        {% include 'custom_email_css.htm' %}
    </head>

    <body style="margin: 0; padding: 0; background-color: #f5f2ed; font-family: Georgia, 'Cormorant Garamond', 'Times New Roman', serif; color: #2c2c3e; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">

        {% include 'custom_email_header.htm' %}

        {% if username != "" %}
            <p style="margin: 0 0 18px 0; font-size: 15.5px; line-height: 1.75; color: #2c2c3e;">
                {{salutation}} {{username}},
            </p>
        {% endif %}

        <p style="margin: 0 0 18px 0; font-size: 15.5px; line-height: 1.75; color: #2c2c3e;">
            {{greeting}}
        </p>

        {% if link != "" %}
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0 8px 0;">
            <tr>
                <td class="ms-email-btn-td" align="left" style="border-radius: 7px; background-color: #1a1a2e;">
                    <a href="{{link}}" target="_blank" style="display: inline-block; padding: 13px 32px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.03em; color: #ffffff; text-decoration: none; border-radius: 7px; border: 1px solid #1a1a2e;">{{link_text}}</a>
                </td>
            </tr>
            </table>
        {% endif %}

        {% include 'custom_email_footer.htm' %}

    </body>

</html>
