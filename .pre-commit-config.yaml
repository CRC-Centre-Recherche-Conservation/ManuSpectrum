---
repos:

  - repo: meta
    hooks:
      - id: check-hooks-apply

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: [--quiet]
        exclude: node_modules

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        # Deliberately NOT media/js: that tree has never been formatted, and
        # running Prettier over it would rewrite 58 files for no behaviour
        # change. ESLint covers it for the defects that matter.
        files: ^manuspectrum/src/
      - id: eslint
        name: eslint
        # npx, not `npm run`: npm swallows the filenames pre-commit appends,
        # so the hook used to lint nothing even when it did fire.
        entry: npx eslint --fix
        language: system
        files: ^manuspectrum/(src|media/js)/.*\.(js|ts|vue)$
      - id: typescript
        name: typescript
        entry: bash -c 'npm run ts:check'
        language: system
        types_or: [
          "ts",
          "vue",
        ]
