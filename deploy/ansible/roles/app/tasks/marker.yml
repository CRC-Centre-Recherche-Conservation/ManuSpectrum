---
- name: Create the run directory of the marker
  ansible.builtin.file:
    path: "{{ app_ansible_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Ansible run marker
  ansible.builtin.file:
    path: "{{ app_ansible_marker }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    access_time: preserve
    modification_time: preserve
