---
- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look for an existing daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: host_daemon_file
  failed_when: false
  check_mode: false

- name: Compare it with the settings of this role
  ansible.builtin.set_fact:
    host_daemon_wanted: "{{ lookup('ansible.builtin.template', 'daemon.json.j2') | from_json }}"
    host_daemon_current: "{{ (host_daemon_file.content | b64decode | from_json) if host_daemon_file.content is defined else {} }}"

- name: Assert the existing daemon.json holds only keys this role sets
  ansible.builtin.assert:
    that:
      - host_daemon_current.keys() | list | difference(host_daemon_wanted.keys() | list) | length == 0
    quiet: true
    fail_msg: >-
      /etc/docker/daemon.json holds settings this role would overwrite
      ({{ host_daemon_current.keys() | list | difference(host_daemon_wanted.keys() | list) | join(', ') }}).
      Merge the settings of roles/host/templates/daemon.json.j2 into that file by hand and run the
      playbook again: it then changes nothing.

- name: Count the running containers
  ansible.builtin.command: docker ps --quiet
  register: host_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert a restart of Docker is allowed
  ansible.builtin.assert:
    that:
      - host_daemon_current == host_daemon_wanted or host_running.stdout_lines | default([]) | length == 0 or docker_restart_ok | default(false) | bool
    quiet: true
    fail_msg: >-
      daemon.json would change and {{ host_running.stdout_lines | default([]) | length }} container(s) run:
      Docker would restart, which stops them. Pick a quiet moment and
      run the playbook again with -e docker_restart_ok=true.

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  notify: restart docker

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep a persistent journal for one year, one file per day
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/manuspectrum.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart journald

- name: Find the logrotate rules of the system logs
  ansible.builtin.stat:
    path: "/etc/logrotate.d/{{ item.rule }}"
  loop: "{{ host_log_rotations }}"
  register: host_log_rotation_rules

- name: Keep the system logs for one year
  ansible.builtin.replace:
    path: "/etc/logrotate.d/{{ item.item.rule }}"
    regexp: '^(\s*)rotate\s+\d+\s*$'
    replace: '\1rotate {{ item.item.rotate }}'
  loop: "{{ host_log_rotation_rules.results }}"
  loop_control:
    label: "{{ item.item.rule }}"
  when: item.stat.exists

- name: Find the hosting provider's TSM client options and nightly job
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ host_tsm_options }}"
    - "{{ host_tsm_cron }}"
  register: host_tsm_files

- name: Declare /var/log as a TSM virtual mount point
  ansible.builtin.lineinfile:
    path: "{{ host_tsm_options }}"
    regexp: '(?i)^\*?\s*virtualmountpoint\s+/var/log/?\s*$'
    line: "        VirtualMountpoint       /var/log"
  when: host_tsm_files.results[0].stat.exists

- name: Add /var/log to the TSM backup domain
  ansible.builtin.replace:
    path: "{{ host_tsm_options }}"
    regexp: '(?i)^(\s*domain\s(?!.*\s/var/log/?(\s|$)).*?)\s*$'
    replace: '\1 /var/log'
  when: host_tsm_files.results[0].stat.exists

- name: Let the nightly TSM backup use the default server of dsm.opt
  ansible.builtin.replace:
    path: "{{ host_tsm_cron }}"
    regexp: '(?i)^(.*\bdsmc\s.*?)\s+-se(rvername)?=\S+(.*)$'
    replace: '\1\3'
  when: host_tsm_files.results[1].stat.exists

- name: Run the nightly TSM backup in a UTF-8 locale
  ansible.builtin.lineinfile:
    path: "{{ host_tsm_cron }}"
    line: export LANG=C.UTF-8 LC_ALL=C.UTF-8
    insertbefore: '^\s*\S*dsmc\s'
    firstmatch: true
  when: host_tsm_files.results[1].stat.exists

- name: Create the drop-in directory of the Docker scopes
  ansible.builtin.file:
    path: /etc/systemd/system/docker-.scope.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the containers from swapping across a systemd reload
  ansible.builtin.template:
    src: docker-scope-no-swap.conf.j2
    dest: /etc/systemd/system/docker-.scope.d/10-manuspectrum-no-swap.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Restart Docker and journald, reload systemd, now, before the stack starts
  ansible.builtin.meta: flush_handlers
