---
- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look for an existing daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: host_daemon_file
  failed_when: false
  check_mode: false

- name: Compare it with the settings of this role
  ansible.builtin.set_fact:
    host_daemon_wanted: "{{ lookup('ansible.builtin.template', 'daemon.json.j2') | from_json }}"
    host_daemon_current: "{{ (host_daemon_file.content | b64decode | from_json) if host_daemon_file.content is defined else {} }}"

- name: Assert the existing daemon.json holds only keys this role sets
  ansible.builtin.assert:
    that:
      - host_daemon_current.keys() | list | difference(host_daemon_wanted.keys() | list) | length == 0
    quiet: true
    fail_msg: >-
      /etc/docker/daemon.json holds settings this role would overwrite
      ({{ host_daemon_current.keys() | list | difference(host_daemon_wanted.keys() | list) | join(', ') }}).
      Merge the settings of roles/host/templates/daemon.json.j2 into that file by hand and run the
      playbook again: it then changes nothing.

- name: Count the running containers
  ansible.builtin.command: docker ps --quiet
  register: host_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert a restart of Docker is allowed
  ansible.builtin.assert:
    that:
      - host_daemon_current == host_daemon_wanted or host_running.stdout_lines | default([]) | length == 0 or docker_restart_ok | default(false) | bool
    quiet: true
    fail_msg: >-
      daemon.json would change and {{ host_running.stdout_lines | default([]) | length }} container(s) run:
      Docker would restart, which stops them. Pick a quiet moment and
      run the playbook again with -e docker_restart_ok=true.

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  notify: restart docker

- name: Find the hosting provider's TSM client options and nightly job
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ host_tsm_options }}"
    - "{{ host_tsm_cron }}"
  register: host_tsm_files

- name: Declare /var/log as a TSM virtual mount point
  ansible.builtin.lineinfile:
    path: "{{ host_tsm_options }}"
    regexp: '(?i)^\*?\s*virtualmountpoint\s+/var/log/?\s*$'
    line: "        VirtualMountpoint       /var/log"
  when: host_tsm_files.results[0].stat.exists

- name: Add /var/log to the TSM backup domain
  ansible.builtin.replace:
    path: "{{ host_tsm_options }}"
    regexp: '(?i)^(\s*domain\s(?!.*\s/var/log/?(\s|$)).*?)\s*$'
    replace: '\1 /var/log'
  when: host_tsm_files.results[0].stat.exists

- name: Let the nightly TSM backup use the default server of dsm.opt
  ansible.builtin.replace:
    path: "{{ host_tsm_cron }}"
    regexp: '(?i)^(.*\bdsmc\s.*?)\s+-se(rvername)?=\S+(.*)$'
    replace: '\1\3'
  when: host_tsm_files.results[1].stat.exists

- name: Run the nightly TSM backup in a UTF-8 locale
  ansible.builtin.lineinfile:
    path: "{{ host_tsm_cron }}"
    line: export LANG=C.UTF-8 LC_ALL=C.UTF-8
    insertbefore: '^\s*\S*dsmc\s'
    firstmatch: true
  when: host_tsm_files.results[1].stat.exists

- name: Read the include option of dsm.sys
  ansible.builtin.command:
    argv:
      - grep
      - -a
      - -c
      - -i
      - -E
      - '^[[:space:]]*inclexcl[[:space:]]+"?{{ host_tsm_inclexcl | regex_escape }}"?[[:space:]]*$'
      - "{{ host_tsm_options }}"
  register: host_tsm_inclexcl_option
  changed_when: false
  failed_when: host_tsm_inclexcl_option.rc > 1
  check_mode: false
  when: host_tsm_files.results[0].stat.exists

- name: Assert dsm.sys names the include file
  ansible.builtin.assert:
    that:
      - host_tsm_inclexcl_option.stdout | int > 0
    quiet: true
    fail_msg: >-
      {{ host_tsm_options }} has no Inclexcl option naming {{ host_tsm_inclexcl }}, so the include
      lines written there would have no effect. Add the line
      Inclexcl "{{ host_tsm_inclexcl }}" to it and run the playbook again.
  when: host_tsm_files.results[0].stat.exists

- name: Read the dateext setting of logrotate
  ansible.builtin.command:
    argv:
      - grep
      - -a
      - -c
      - -E
      - '^[[:space:]]*dateext[[:space:]]*$'
      - "{{ host_logrotate_conf }}"
  register: host_logrotate_dateext
  changed_when: false
  failed_when: host_logrotate_dateext.rc > 1
  check_mode: false
  when: host_tsm_files.results[0].stat.exists

- name: Assert logrotate writes dated names
  ansible.builtin.assert:
    that:
      - host_logrotate_dateext.stdout | int > 0
    quiet: true
    fail_msg: >-
      {{ host_logrotate_conf }} does not set dateext. The TSM log class keeps one version per file name,
      so rotated logs must carry dated names: add a line "dateext" to it and run the playbook again.
  when: host_tsm_files.results[0].stat.exists

- name: Assert every log directory is one the nightly report is checked for
  ansible.builtin.assert:
    that:
      - item == '/var/log' or item is match('/var/log/') or item is match((host_tsm_data_path | regex_escape) ~ '(/|$)')
    quiet: true
    fail_msg: >-
      {{ item }} is outside the filespaces the nightly report is checked for ({{ host_tsm_data_path }}
      and /var/log), so its logs would not be known to be backed up. Keep the log directories under one of them.
  loop: "{{ host_tsm_log_dirs }}"
  when: host_tsm_files.results[0].stat.exists

- name: Bind the log directories to the TSM log class
  ansible.builtin.blockinfile:
    path: "{{ host_tsm_inclexcl }}"
    create: false
    marker: "* {mark} ManuSpectrum logs"
    block: |
      {% for dir in host_tsm_log_dirs %}
      include {{ dir }}/.../* {{ host_tsm_log_class }}
      {% endfor %}
  when: host_tsm_files.results[0].stat.exists

- name: Decide whether the log retention may shrink
  ansible.builtin.import_tasks: log_retention_gate.yml

- name: Say the log retention was left unchanged
  ansible.builtin.debug:
    msg: >-
      The log retention tasks were skipped: the provider's last report is not a successful backup
      at least {{ host_tsm_report_margin_seconds // 60 }} minutes newer than the include lines, or
      the include lines are missing. Run the playbook again after the next successful nightly backup.
  when: not host_log_retention_ready

- name: Count the lines of the provider's job the guard line can be placed before
  ansible.builtin.command:
    argv:
      - grep
      - -a
      - -c
      - -E
      - '^[[:space:]]*[^[:space:]]*dsmc[[:space:]]'
      - "{{ host_tsm_cron }}"
  register: host_repo_guard_anchor
  changed_when: false
  failed_when: host_repo_guard_anchor.rc > 1
  check_mode: false
  when: host_tsm_files.results[1].stat.exists

- name: Assert the provider's job has a dsmc line to place the guard before
  ansible.builtin.assert:
    that:
      - host_repo_guard_anchor.stdout | int > 0
    quiet: true
    fail_msg: >-
      {{ host_tsm_cron }} has no line that starts with the dsmc command (a path to it is
      accepted), so the guard line could not be placed before the copy. The restic repository
      guard was not installed. Run the guard by hand before the copy, or adapt the job, and run
      the playbook again.
  when: host_tsm_files.results[1].stat.exists

- name: Create the directory of the restic repository guard
  ansible.builtin.file:
    path: "{{ host_repo_guard_dir }}"
    state: directory
    owner: "{{ host_repo_guard_owner }}"
    group: "{{ host_repo_guard_group }}"
    mode: "0755"
  when: host_tsm_files.results[1].stat.exists

- name: Create the state directory of the restic repository guard
  ansible.builtin.file:
    path: "{{ host_repo_guard_state_dir }}"
    state: directory
    owner: "{{ host_repo_guard_owner }}"
    group: "{{ host_repo_guard_group }}"
    mode: "0700"
  when: host_tsm_files.results[1].stat.exists

- name: Install the restic repository guard
  ansible.builtin.copy:
    src: "{{ host_repo_guard_src_dir }}/{{ item.name }}"
    dest: "{{ host_repo_guard_dir }}/{{ item.name }}"
    owner: "{{ host_repo_guard_owner }}"
    group: "{{ host_repo_guard_group }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_repo_guard_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: host_tsm_files.results[1].stat.exists

- name: Run the restic repository guard before the nightly TSM backup
  ansible.builtin.lineinfile:
    path: "{{ host_tsm_cron }}"
    regexp: 'restic-repo-guard\.sh'
    line: >-
      METRICS_TEXTFILE_DIR={{ env_metrics_textfile_dir | quote }}
      RESTIC_REPOSITORY_DIR={{ env_restic_repository_dir | quote }}
      RESTIC_GUARD_STATE_DIR={{ host_repo_guard_state_dir | quote }}
      {{ (host_repo_guard_dir ~ '/restic-repo-guard.sh') | quote }}
      >/dev/null 2>&1 || [ "$?" -ne 1 ] || exit 0
    insertbefore: '^\s*\S*dsmc\s'
    firstmatch: true
  when: host_tsm_files.results[1].stat.exists

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: host_log_retention_ready

- name: Keep a persistent journal for thirty days, one file per day
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/manuspectrum.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart journald
  when: host_log_retention_ready

- name: Find the logrotate rules of the system logs
  ansible.builtin.stat:
    path: "/etc/logrotate.d/{{ item.rule }}"
  loop: "{{ host_log_rotations }}"
  register: host_log_rotation_rules
  check_mode: false

- name: Keep four weekly files of the system logs
  ansible.builtin.replace:
    path: "/etc/logrotate.d/{{ item.item.rule }}"
    regexp: '^(\s*)rotate\s+\d+\s*$'
    replace: '\1rotate {{ item.item.rotate }}'
  loop: "{{ host_log_rotation_rules.results }}"
  loop_control:
    label: "{{ item.item.rule }}"
  when: host_log_retention_ready and item.stat.exists

- name: Set the rotation frequency of the system logs
  ansible.builtin.replace:
    path: "/etc/logrotate.d/{{ item.item.rule }}"
    regexp: '^(\s*)(daily|weekly|monthly|yearly)\s*$'
    replace: '\1{{ item.item.frequency }}'
  loop: "{{ host_log_rotation_rules.results }}"
  loop_control:
    label: "{{ item.item.rule }}"
  when: host_log_retention_ready and item.stat.exists

- name: Create the drop-in directory of the Docker scopes
  ansible.builtin.file:
    path: /etc/systemd/system/docker-.scope.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the containers from swapping across a systemd reload
  ansible.builtin.template:
    src: docker-scope-no-swap.conf.j2
    dest: /etc/systemd/system/docker-.scope.d/10-manuspectrum-no-swap.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Restart Docker and journald, reload systemd, now, before the stack starts
  ansible.builtin.meta: flush_handlers
