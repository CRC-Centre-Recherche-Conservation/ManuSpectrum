# Recording rules of the activity figures: consultations by kind.
# One rule per kind maps route names (the `view` label of django-prometheus) to a closed
# vocabulary; GET answers 2xx or 304 only. Robots are counted. `manuspectrum:consultations:total`
# keeps job and instance so that it stays a counter per target; the dashboards and the monthly
# report read `sum by (kind) (increase(manuspectrum:consultations:total[...]))`.
# tests/test_rules_contract.py checks that every route of urls.py is mapped or ignored.
groups:
  - name: activity
    rules:
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"root|home"})
        labels:
          kind: home
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"about-model|about-explorer|about-team|about-contact"})
        labels:
          kind: about
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"analysis-explorer"})
        labels:
          kind: explorer_open
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"explorer-search"})
        labels:
