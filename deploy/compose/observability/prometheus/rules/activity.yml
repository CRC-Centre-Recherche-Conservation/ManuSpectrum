        labels:
          kind: explorer_compare
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"explorer-series-csv|iiif-data-series"})
        labels:
          kind: export_csv
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"explorer-export"})
        labels:
          kind: export_zip
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"iiif-v3-explorer-manifest"})
        labels:
          kind: export_manifest
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"explorer-share"})
        labels:
          kind: share
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"resource_report"})
        labels:
          kind: resource_report
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"api-summary|api-summary-batch"})
        labels:
