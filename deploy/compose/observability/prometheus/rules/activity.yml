      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"iiif-v2-annotation-collection|iiif-v3-annotation-collection|iiif-v2-annotation|iiif-v3-annotation|iiif-v2-annotation-zone|iiif-v3-annotation-zone|iiif-v2-annotation-page|iiif-v3-annotation-page|iiif-v2-characterization-collection|iiif-v3-characterization-collection|iiif-v2-characterization-page|iiif-v3-characterization-page|iiif-v3-content-state"})
        labels:
          kind: iiif_annotations
      - record: manuspectrum:consultations:total
        expr: |
          sum by (job, instance) (django_http_responses_total_by_status_view_method_total{method="GET",status=~"2..|304",view=~"manifest"})
