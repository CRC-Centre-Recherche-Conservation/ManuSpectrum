# Alert rules of the monitoring stack: containers.
# Severity: critical = mailed at once, warning = grouped weekday e-mail, info = never mailed.
groups:
  - name: containers
    rules:
      - alert: ContainerRestartLoop
        expr: |
          max_over_time((manuspectrum_container_restarts - min_over_time(manuspectrum_container_restarts[1h]))[64h:5m]) > 3
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "A container restarts in a loop"
          description: "{{ $labels.container }} restarted {{ $value }} times within an hour in the last 64 hours."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#containerrestartloop
      - alert: ContainerOOMKilled
        expr: |
          increase(manuspectrum_container_oom_kills[64h]) > 0
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "A container was killed for lack of memory"
          description: "{{ $labels.container }} was killed by the kernel for exceeding its memory limit."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#containeroomkilled
      - alert: OomSourceDegraded
        expr: |
          manuspectrum_container_oom_cgroup == 0
        for: 1h
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "OOM kills of a container are no longer counted from the kernel"
          description: "For every container the collector fell back on Docker's OOMKilled flag, which misses most kills; the cgroup memory.events file is unreadable."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#oomsourcedegraded
      - alert: ContainerMemoryNearLimit
        expr: |
          manuspectrum_container_memory_working_set_bytes{container!="web"}
          / (manuspectrum_container_memory_limit_bytes{container!="web"} > 0) > 0.9
        for: 30m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "A container is close to its memory limit"
          description: "{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#containermemorynearlimit
      - alert: WebMemoryNearLimit
        expr: |
          manuspectrum_container_memory_working_set_bytes{container="web"}
          / (manuspectrum_container_memory_limit_bytes{container="web"} > 0) > 0.8
        for: 30m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "The web container is close to its memory limit"
          description: "web uses {{ $value | humanizePercentage }} of its memory limit; each gunicorn worker holds the Explorer corpus."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#webmemorynearlimit
      - alert: ContainerUnhealthy
        expr: |
          manuspectrum_container_healthy == 0
        for: 10m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "A container is unhealthy"
          description: "{{ $labels.container }} fails its health check."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#containerunhealthy
      - alert: ContainerMissing
        expr: |
          (count(manuspectrum_container_up{container=~"postgres|elasticsearch|redis-broker|redis-cache|cantaloupe|web|worker|beat|nginx"} == 1) or vector(0)) < 9
          and on() (up{job="node"} == 1)
        for: 10m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "A core container is not running"
          description: "{{ $value }} of the 9 core containers run."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/containers.md#containermissing
