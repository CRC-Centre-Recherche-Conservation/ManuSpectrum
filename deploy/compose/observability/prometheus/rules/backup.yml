# Alert rules of the monitoring stack: backup.
# Severity: critical = mailed at once, warning = grouped weekday e-mail, info = never mailed.
groups:
  - name: backup
    rules:
      - alert: BackupFailed
        expr: |
          manuspectrum_backup_failed == 1
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "The last backup failed"
          description: "The last backup run ended in failure; the previous good backup remains."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#backupfailed
      - alert: BackupMissing
        expr: |
          (
            time() - manuspectrum_backup_last_success_timestamp_seconds > 26 * 3600
            or
            absent(manuspectrum_backup_last_success_timestamp_seconds)
          )
          and on() (up{job="node"} == 1)
        for: 15m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "No successful backup for more than 26 hours"
          description: "The last successful backup is older than 26 hours, or no backup metric exists."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#backupmissing
      - alert: RestoreTestFailed
        expr: |
          manuspectrum_restore_test_failed == 1
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "The restore test failed"
          description: "The weekly restore test ended in failure: the latest backup may not be restorable."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#restoretestfailed
      - alert: RestoreTestMissing
        expr: |
          (
            time() - manuspectrum_restore_test_last_success_timestamp_seconds > 8 * 86400
            or
            absent(manuspectrum_restore_test_last_success_timestamp_seconds)
          )
          and on() (up{job="node"} == 1)
        for: 15m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "No successful restore test for more than 8 days"
          description: "The weekly restore test has not succeeded for 8 days, or no metric exists."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#restoretestmissing
      - alert: TsmBackupStale
        expr: |
          (
            (
              manuspectrum_tsm_check_enabled == 1
              unless on() manuspectrum_tsm_backup_last_success_timestamp_seconds
            )
            or
            (
              manuspectrum_tsm_check_enabled == 1
              and on() (time() - manuspectrum_tsm_backup_last_success_timestamp_seconds > 54 * 3600)
            )
          )
          and on() (up{job="node"} == 1)
        for: 15m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "No successful TSM backup of the host for more than two days"
          description: "The hosting provider's daily TSM backup has not completed for more than 54 hours, or no success has been seen on a host where dsmc is installed."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#tsmbackupstale
      - alert: TsmLogIncludeMissing
        expr: |
          (
            manuspectrum_tsm_check_enabled == 1
            and on() manuspectrum_tsm_log_include_ok == 0
          )
          and on() (up{job="node"} == 1)
        for: 15m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "The server logs are no longer bound to the provider's log class"
          description: "The TSM include file no longer binds every log directory to the log class that keeps deleted files for 365 days."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#tsmlogincludemissing
      - alert: ResticRepoAltered
        expr: |
          (manuspectrum_restic_repo_guard_mismatches > 0)
          and on() (up{job="node"} == 1)
        for: 5m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "The restic repository holds a file that does not match its name"
          description: "The check run before the provider's TSM copy found a restic repository file whose content no longer matches its name; the TSM copy did not run that day."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#resticrepoaltered
      - alert: ResticRepoGuardStale
        expr: |
          (
            (
              manuspectrum_tsm_check_enabled == 1
              unless on() manuspectrum_restic_repo_guard_last_success_timestamp_seconds
            )
            or
            (time() - manuspectrum_restic_repo_guard_last_success_timestamp_seconds > 54 * 3600)
          )
          and on() (up{job="node"} == 1)
        for: 15m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "The restic repository check has not succeeded for more than two days"
          description: "The check run before the provider's TSM copy has not passed for more than 54 hours, or has never passed on a host backed up by the provider's TSM: it cannot run, or it keeps finding an altered file."
          runbook_url: https://github.com/CRC-Centre-Recherche-Conservation/ManuSpectrum/blob/main/deploy/runbooks/backup.md#resticrepoguardstale
