# Prometheus of the monitoring stack (profile observability).
#
# Every target is a Compose service on the internal network, scraped directly:
# web:8000/metrics and worker:9808/metrics refuse a request carrying
# X-Forwarded-For and nginx denies both paths, so nothing here goes through the
# edge. Label values stay bounded: targets are service names, never an id, a
# user or a URL path from a request.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  label_limit: 40
  label_name_length_limit: 80
  label_value_length_limit: 200

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: web
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]

  - job_name: worker
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9808"]

  - job_name: node
    scrape_interval: 60s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    scrape_interval: 60s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # One exporter for both instances: the exporter's multi-target endpoint.
  - job_name: redis
    scrape_interval: 60s
    metrics_path: /scrape
    static_configs:
      - targets: ["redis-broker:6379", "redis-cache:6379"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.+)"
        replacement: "redis://$1"
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121

  # Readiness of the application, from inside: /readyz is denied at the edge.
  - job_name: blackbox-readyz
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_readyz]
    static_configs:
      - targets: ["http://web:8000/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The public name through nginx; entrypoint.sh writes the target
  # (https://${PUBLIC_HOST}/healthz) to /tmp/edge_targets.json. The probe also
  # measures the certificate expiry, without verifying the chain.
  - job_name: blackbox-edge
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_edge]
    file_sd_configs:
      - files: ["/tmp/edge_targets.json"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The same target with the certificate chain verified, for CertificateInvalid.
  - job_name: blackbox-edge-verified
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_edge_verified]
    file_sd_configs:
      - files: ["/tmp/edge_targets.json"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-cantaloupe
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_cantaloupe]
    static_configs:
      - targets: ["http://cantaloupe:8182/iiif/3"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
