# Static files of the current release, published by deploy/docker/publish-static.sh
# into the read-only `static` volume. `current` is a relative symlink swapped
# by rename.

location ^~ /static/ {
    alias /srv/static/current/;
    include snippets/security-headers.conf;
    include snippets/local-headers.conf;
    add_header Cache-Control $static_cache_control;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;

    # .build-id and .complete are bookkeeping files.
    location ~ /\.[^/]*$ {
        return 404;
    }
}

# Browsers and robots ask /favicon.ico at the root whatever a page links: the
# answer is the site icon the templates link (static favicons/favicon.ico).
location = /favicon.ico {
    alias /srv/static/current/favicons/favicon.ico;
    include snippets/security-headers.conf;
    include snippets/local-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
}
