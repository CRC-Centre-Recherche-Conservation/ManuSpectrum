# Uploaded files and search exports. Django decides: FileView answers a 302
# to /files/(uploadedfiles|export_deliverables)/<name>, and only that redirect
# is followed, internally, to the loopback server that holds the aliases.
# Anything else FileView answers (403, 404) is passed through unchanged.

location ~ "^/(en|fr)/files/[0-9a-fA-F-]{36}$" {
    include snippets/proxy-web.conf;
    limit_req zone=site burst=60 nodelay;
    limit_conn perip 20;

    # @media is reached by an error_page (the 302) and has its own, hence
    # recursive_error_pages: it is read where the first one is taken.
    recursive_error_pages on;
    proxy_intercept_errors on;
    error_page 302 = @media;
    # An error_page here replaces the server-level ones.
    error_page 429 /_errors/429.html;
    error_page 500 502 503 504 /_errors/50x.html;
    proxy_pass http://web_up;
}

# No add_header: the response carries the headers of the loopback server and
# the server-level ones. $upstream_http_location is the raw encoded value.
location @media {
    set $media_target $upstream_http_location;
    if ($media_target !~ "^/files/(uploadedfiles|export_deliverables)/(?!.*(%2[Ff]|%5[Cc]|\.\.))[^/?#]+$") {
        return 404;
    }
    proxy_set_header Host media.internal;
    # A File row whose bytes are missing on disk: the loopback 404 is replaced
    # by the site page, without the attachment headers of the media server.
    proxy_intercept_errors on;
    error_page 404 /_errors/404.html;
    proxy_pass http://127.0.0.1:8081$media_target;
}
