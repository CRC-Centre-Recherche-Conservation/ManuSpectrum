# Proxy to Django (gunicorn). Forwarded headers are written here, never
# relayed: gunicorn trusts forwarded scheme headers from any address.
# An empty value makes nginx drop the header.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Forwarded-Protocol "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header Forwarded "";

proxy_connect_timeout 10s;
proxy_send_timeout 90s;
proxy_read_timeout 90s;

proxy_hide_header Server;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
