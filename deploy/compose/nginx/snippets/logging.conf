# JSON access log, written to the host log directory (rotated by host
# logrotate). The URI is logged without its query string, the token of a
# password-reset, account-activation or two-factor reset link is replaced, and the referer
# keeps its path only.

# $request_uri is never rewritten by an internal redirect (error_page), unlike
# $uri, so a refused or limited request is logged under its own path. It is the
# raw target: the reset rule also catches percent-encoded spellings that
# Django would decode to the same route.
map $request_uri $log_uri {
    "~^/(?<lang>en|fr)/reset/"                                                  "/$lang/reset/[redacted]";
    "~^/(?<lang>en|fr)/account/activate/"                                       "/$lang/account/activate/[redacted]";
    "~^/(?<lang>en|fr)/account/two-factor/reset/"                               "/$lang/account/two-factor/reset/[redacted]";
    "~*^/+(en|fr|%65n|%66r|e%6e|f%72|%65%6e|%66%72)(/|%2f)+(r|%72)(e|%65)(s|%73)(e|%65)(t|%74)(/|%2f|$)" "/[redacted]";
    "~^(?<request_path>[^?]*)"                                                  $request_path;
    default                                                                     "";
}

# A referer that names a link carrying a secret (reset, activation, two-factor
# re-enrolment) is logged as "[redacted]", whatever its spelling.
map $http_referer $log_referer {
    "~*^[a-z][a-z0-9+.-]*://[^/?#]*/+(en|fr|%65n|%66r|e%6e|f%72|%65%6e|%66%72)(/|%2f)+((r|%72)(e|%65)(s|%73)(e|%65)(t|%74)|(a|%61)(c|%63)(c|%63)(o|%6f)(u|%75)(n|%6e)(t|%74)(/|%2f)+(a|%61)(c|%63)(t|%74)(i|%69)(v|%76)(a|%61)(t|%74)(e|%65)|(a|%61)(c|%63)(c|%63)(o|%6f)(u|%75)(n|%6e)(t|%74)(/|%2f)+(t|%74)(w|%77)(o|%6f)(-|%2d)(f|%66)(a|%61)(c|%63)(t|%74)(o|%6f)(r|%72)(/|%2f)+(r|%72)(e|%65)(s|%73)(e|%65)(t|%74))(/|%2f|[?#]|$)"
                                "[redacted]";
    "~^(?<referer_path>[^?#]*)" $referer_path;
    default                     "";
}

log_format ms_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$log_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"host":"$host","referer":"$log_referer","user_agent":"$http_user_agent",'
    '"protocol":"$server_protocol","tls":"$ssl_protocol"}';

access_log /var/log/manuspectrum/access.log ms_json;
