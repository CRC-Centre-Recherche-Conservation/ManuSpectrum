# Edge rules of the 443 server (issue #45). Regex locations are tried in file
# order and stop at the first match: the denials come first, then the routes
# with their own limits, then the generic API. Routes above the language
# boundary carry (en|fr); the ones below it stay bare.
# No ^~ prefix location may sit above these: it would hide them.

# arches-querysets REST API and the two arches-vue-components routes that
# reuse its views: no client calls them and their lists ignore permissions.
# api/tiles/ (core) and api/relatable-resources/ are not touched.
location ~ ^/(en|fr)/api/(resource|tile|tile-list-create|tile-new-resource)/ {
    return 404;
}

location ~ ^/(en|fr)/silk/ {
    return 404;
}

# Self-signup is closed (ENABLE_USER_SIGNUP = False): Arches answers a closed
# signup with a bare Exception, a 500. The two Arches 2FA routes below are
# refused too: two-factor enrolment and reset are project-side
# (manuspectrum/accounts/twofactor.py).
location ~ ^/(en|fr)/(auth/(signup|confirm_signup)|two-factor-authentication-(settings|reset)) {
    return 404;
}

# Internal endpoints: refused with an empty body, never proxied. The server's
# 404 page is replaced by an empty answer that keeps the 404 status.
location = /metrics {
    error_page 404 =404 @empty;
    return 404;
}

location = /readyz {
    error_page 404 =404 @empty;
    return 404;
}

location @empty {
    return 200 "";
}

# Liveness: reads no dependency, public on purpose (external probe).
location = /healthz {
    include snippets/proxy-web.conf;
    limit_req zone=site burst=10 nodelay;
    limit_conn perip 20;
    proxy_pass http://web_up;
}

# Search exports: the same work as a Celery export, run in the web worker.
# A geojson export without a Django session cookie is refused with 403
# ($anonymous_geojson_export, ratelimit.conf): Arches always builds geojson in
# the request, up to the gunicorn timeout. It is a light barrier against
# robots only: a forged cookie still runs as the anonymous user in Django,
# bounded by limit_conn export_conn 1.
# $arg_format reads the first "format", Django the last (decoded): any other
# format and any encoded parameter name is refused.
location ~ ^/(en|fr)/api/search/export_results$ {
    if ($arg_format != "geojson") {
        return 404;
    }
    if ($args ~* "(^|&)(format|[^&=]*%[^&=]*)=(?!geojson(&|$))") {
        return 404;
    }
    if ($anonymous_geojson_export) {
        return 403;
    }
    include snippets/proxy-web-core.conf;
    limit_req zone=search_export burst=3 nodelay;
    limit_conn export_conn 1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 120s;
    proxy_pass http://web_up;
}

location ~ ^/(en|fr)/search/export_results$ {
    if ($anonymous_geojson_export) {
        return 403;
    }
    include snippets/proxy-web-core.conf;
    limit_req zone=search_export burst=3 nodelay;
    limit_conn export_conn 1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 120s;
    proxy_pass http://web_up;
}

# POST drops a file into archestemp/ with no group check; GET is the download
# button of the Bulk Data Manager exports and reaches Django.
# The route without an id has nothing to serve (TempFileView.get takes a
# file_id and answers a bare 500; the POST is the closed upload above).
location ~ ^/(en|fr)/temp_file$ {
    return 404;
}

# Temp file ids are uuid4 (TempFile.fileid): any other id raises in the ORM.
# Quoted because the pattern holds braces.
location ~ "^/(en|fr)/temp_file/(?![0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$)" {
    return 404;
}

location ~ ^/(en|fr)/temp_file/ {
    include snippets/proxy-web.conf;
    limit_req zone=site burst=60 nodelay;
    limit_conn perip 20;
    proxy_pass http://web_up;
}

# Biblissima creations: one request may run 5 x 60 s inside Django (gunicorn
# timeout 330 s). A retry would create the resources twice.
location ~ ^/api/biblissima/create-(all|resource)$ {
    include snippets/proxy-web-core.conf;
    limit_req zone=api burst=20 nodelay;
    limit_conn perip 20;
    proxy_connect_timeout 10s;
    proxy_send_timeout 340s;
    proxy_read_timeout 340s;
    proxy_next_upstream off;
    proxy_pass http://web_up;
}

# Streamed downloads: not buffered by nginx, not gzipped (the ZIP announces its
# Content-Length), read timeout = gunicorn graceful_timeout.
location ~ ^/api/explorer/(export|series\.csv)$ {
    include snippets/proxy-web-core.conf;
    limit_req zone=heavy burst=6 nodelay;
    limit_conn export_conn 2;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    gzip off;
    proxy_pass http://web_up;
}

# The share summary has its own zone: it is a light read the page calls
# often, unlike the manifest.
location ~ ^/(en|fr)/api/explorer/share$ {
    include snippets/proxy-web.conf;
    limit_req zone=share burst=10 nodelay;
    limit_conn perip 20;
    proxy_pass http://web_up;
}

# Map vector tiles: a map view fetches a dozen tiles per layer at once, on the
# same rate zone as the IIIF image tiles. A tile in flight holds a connection
# slot (one per HTTP/2 stream): own zone, so a map never spends the `perip`
# quota of the page's other calls.
location ~ ^/(en|fr)/mvt/ {
    include snippets/proxy-web.conf;
    limit_req zone=tiles burst=200 nodelay;
    limit_conn tiles_conn 40;
    proxy_pass http://web_up;
}

# The core IIIF viewer (iiif-viewer.js) fetches the annotations of every canvas
# of a manuscript, one GET per canvas, in batches of 20 concurrent requests per
# annotation node (the next batch starts when the previous one is done):
# ~1900 requests for a large manuscript. Each model has one annotation node, so
# a page peaks at 20 in flight. Measured on the dev database (Django test
# client, one process): ~0.44 s per request (vw_annotations is read whatever
# the canvas), so one worker thread answers ~2 r/s and the 20 threads of
# production (5 workers x 4) ~45 r/s: a page load takes ~40 s of the whole pool.
# Sizing: burst 2000 lets one page load through, 50 r/s (the measured
# throughput) refills it in ~40 s; annotations_conn 20 is the viewer's batch and
# also all the request threads there are, so a second editor tab or a second
# annotation node gets 429 on the surplus fetches (the viewer logs them and
# shows no count) instead of holding every thread. limit_conn counts one slot
# per in-flight request, HTTP/2 streams included, so these fetches have their
# own zone and never spend the `perip` quota of the page's other calls.
location ~ ^/(en|fr)/iiifannotations$ {
    include snippets/proxy-web.conf;
    limit_req zone=annotations burst=2000 nodelay;
    limit_conn annotations_conn 20;
    proxy_pass http://web_up;
}

# Other heavy Explorer products.
location = /iiif/v3/explorer-manifest {
    include snippets/proxy-web.conf;
    limit_req zone=heavy burst=6 nodelay;
    limit_conn export_conn 2;
    proxy_pass http://web_up;
}

# The full series of a spectrum is read and serialised on every request.
location ~ ^/api/spectrum-preview/ {
    include snippets/proxy-web.conf;
    limit_req zone=preview_full burst=10 nodelay;
    limit_req zone=api burst=20 nodelay;
    limit_conn perip 20;
    proxy_pass http://web_up;
}

# Sign-in and password routes: only POST is counted (see ratelimit.conf).
location ~ ^/(en|fr)/(auth/|admin/login/|password_reset/|reset/|account/activate/|account/two-factor|account/terms|o/token/|two-factor-authentication-login) {
    include snippets/proxy-web.conf;
    limit_req zone=auth burst=5 nodelay;
    limit_req zone=site burst=60 nodelay;
    limit_conn perip 20;
    proxy_pass http://web_up;
}

location ~ ^((/(en|fr))?/api/|/iiif/) {
    include snippets/proxy-web.conf;
    limit_req zone=api burst=20 nodelay;
    limit_conn perip 20;
    proxy_pass http://web_up;
}
