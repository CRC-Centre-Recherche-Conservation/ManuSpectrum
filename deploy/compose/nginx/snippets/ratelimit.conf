# Rate-limit zones and their key maps (http context). The limits are applied
# in edge-rules.conf, media.conf, iiifserver.conf and the catch-all location.
# A request whose key is empty is not counted.

limit_req_status 429;
limit_conn_status 429;

# Refusals are counted by the access log (429); error.log keeps its raw
# request lines for real upstream and proxy errors only.
limit_req_log_level notice;
limit_conn_log_level notice;

# Only POST counts for the sign-in routes: the pages themselves are free.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}

# Only the full series of a spectrum is expensive.
map $arg_n $preview_full_key {
    full    $binary_remote_addr;
    default "";
}

# 1 for a search export that may ask for geojson and carries no session
# cookie (the name is settings.SESSION_COOKIE_NAME, pinned by
# tests/test_edge_contract.py). $arg_format is not used: it reads the first
# value, undecoded, while Django reads the last one, decoded. The key is
# "<cookie>|<args>"; an empty cookie leaves "|<args>", matched when some
# parameter named format (or with a percent-encoded name) has a value that
# says geojson in any case or is itself percent-encoded.
map "$cookie_manuspectrum|$args" $anonymous_geojson_export {
    default                                          0;
    "~*^[|](.*&)?(format|[^&=]*%[^&=]*)=[^&]*(geojson|%)" 1;
}

limit_req_zone $auth_limit_key        zone=auth:10m         rate=5r/m;
limit_req_zone $binary_remote_addr    zone=api:10m          rate=10r/s;
limit_req_zone $binary_remote_addr    zone=site:10m         rate=30r/s;
limit_req_zone $binary_remote_addr    zone=tiles:10m        rate=50r/s;
limit_req_zone $binary_remote_addr    zone=annotations:10m  rate=10r/s;
limit_req_zone $server_name           zone=annotations_site:1m rate=20r/s;
limit_req_zone $binary_remote_addr    zone=heavy:10m        rate=12r/m;
limit_req_zone $binary_remote_addr    zone=share:10m        rate=30r/m;
limit_req_zone $binary_remote_addr    zone=explorer:10m     rate=10r/s;
limit_req_zone $binary_remote_addr    zone=explorer_budget:10m rate=100r/m;
limit_req_zone $preview_full_key      zone=preview_full:10m rate=30r/m;
limit_req_zone $binary_remote_addr    zone=search_export:10m rate=6r/m;
limit_req_zone $binary_remote_addr    zone=csp_report:10m   rate=30r/m;

limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_zone $binary_remote_addr zone=export_conn:10m;
limit_conn_zone $binary_remote_addr zone=annotations_conn:10m;
limit_conn_zone $binary_remote_addr zone=tiles_conn:10m;
limit_conn_zone $binary_remote_addr zone=preview_conn:10m;
