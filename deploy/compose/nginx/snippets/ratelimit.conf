# Rate-limit zones and their key maps (http context). The limits are applied
# in edge-rules.conf, media.conf, iiifserver.conf and the catch-all location.
# A request whose key is empty is not counted.

limit_req_status 429;
limit_conn_status 429;

# Only POST counts for the sign-in routes: the pages themselves are free.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}

# Only the full series of a spectrum is expensive.
map $arg_n $preview_full_key {
    full    $binary_remote_addr;
    default "";
}

limit_req_zone $auth_limit_key        zone=auth:10m         rate=5r/m;
limit_req_zone $binary_remote_addr    zone=api:10m          rate=10r/s;
limit_req_zone $binary_remote_addr    zone=site:10m         rate=30r/s;
limit_req_zone $binary_remote_addr    zone=tiles:10m        rate=50r/s;
limit_req_zone $binary_remote_addr    zone=heavy:10m        rate=12r/m;
limit_req_zone $preview_full_key      zone=preview_full:10m rate=30r/m;
limit_req_zone $binary_remote_addr    zone=search_export:10m rate=6r/m;

limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_zone $binary_remote_addr zone=export_conn:10m;
