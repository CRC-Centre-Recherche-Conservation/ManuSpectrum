# The IIIF image server, proxied straight to Cantaloupe. $cantaloupe_path
# (nginx.conf) keeps the raw request target, so %2F, %20 and UTF-8 sequences
# reach Cantaloupe byte for byte; anything but /iiif/2|3/ has no route.
# The only CORS headers of the site are set here (/iiif/ keeps Django's own).

location ~ ^(/(en|fr))?/iiifserver/ {
    if ($cantaloupe_path = "") {
        return 404;
    }
    if ($request_method = OPTIONS) {
        return 204;
    }
    limit_req zone=tiles burst=200 nodelay;
    limit_conn perip 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Server;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    include snippets/security-headers.conf;
    include snippets/local-headers.conf;

    proxy_pass http://cantaloupe_up$cantaloupe_path;
}
