# Main configuration of the edge nginx (image nginxinc/nginx-unprivileged).
# Mounted read-only at /etc/nginx/nginx.conf; every writable path is a tmpfs
# or the log bind. The servers come from templates/manuspectrum.conf.template,
# rendered by the image entrypoint into /tmp/conf.d.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /var/log/manuspectrum/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    client_max_body_size 100m;
    proxy_max_temp_file_size 0;

    # Docker's embedded DNS: a recreated upstream is followed without a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # keepalive_timeout stays below gunicorn's keepalive (5 s).
    upstream web_up {
        zone web_up 64k;
        server web:8000 resolve;
        keepalive 16;
        keepalive_timeout 4s;
    }

    upstream cantaloupe_up {
        zone cantaloupe_up 64k;
        server cantaloupe:8182 resolve;
        keepalive 16;
        keepalive_timeout 4s;
    }

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json application/ld+json application/xml image/svg+xml;

    # Hashed webpack outputs (20 hex characters) never change.
    map $uri $static_cache_control {
        "~\.[0-9a-f]{20}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
        default                       "public, max-age=3600";
    }

    # Uploaded bytes are attachments unless they are plain raster images.
    map $uri $media_disposition {
        "~*\.(png|jpe?g|gif|webp|tiff?)$" "";
        default                           "attachment";
    }

    # /(en|fr)?/iiifserver/iiif/(2|3)/... -> the raw path and query for
    # Cantaloupe; empty means no route.
    map $request_uri $cantaloupe_path {
        "~^(?:/(?:en|fr))?/iiifserver(?<rest>/iiif/[23]/[^?]*)(?<q>\?.*)?$" $rest$q;
        default "";
    }

    include snippets/logging.conf;
    include snippets/ratelimit.conf;

    include /tmp/conf.d/*.conf;
}
