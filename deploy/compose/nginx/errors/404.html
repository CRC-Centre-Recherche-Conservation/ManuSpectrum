<!DOCTYPE html>
<!-- Edge page of nginx. Same design as manuspectrum/templates/errors/500.htm
     (self-contained: inline styles, bilingual text hardcoded). -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — ManuSpectrum</title>
    <style>
        body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #faf9f7; color: #1a1a2e;
               display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; }
        .box { padding: 40px 24px; max-width: 620px; }
        .brand { font-size: 1.05rem; letter-spacing: 0.24em; text-transform: uppercase; }
        .bar { height: 3px; width: 120px; margin: 22px auto; border-radius: 2px;
               background: linear-gradient(90deg, #dc3545, #e67e22, #f0b429, #10b981, #3b82f6, #8b5cf6); }
        .code { font-size: 5.5rem; line-height: 1; margin: 0.2em 0; }
        h1 { font-size: 1.5rem; font-weight: 400; margin: 0 0 6px; }
        p { color: #55556b; line-height: 1.6; margin: 8px 0; }
        a { color: #1a1a2e; }
    </style>
</head>
<body>
    <div class="box">
        <div class="brand">ManuSpectrum</div>
        <div class="bar"></div>
        <div class="code" aria-hidden="true">404</div>
        <h1>Page not found / Page introuvable</h1>
        <p>The page you asked for does not exist.</p>
        <p>La page demandée n'existe pas.</p>
        <p><a href="/">Back to the homepage / Retour à l'accueil</a></p>
    </div>
</body>
</html>
