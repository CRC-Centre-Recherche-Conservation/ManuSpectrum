# Sizing of the production host (22 GB RAM, 8 vCPU): the budget of the capacity
# review (docs/superpowers/specs/2026-10-05-capacity-and-observability-review.md,
# §2.11), measured again on the rehearsal VM (docker stats during a full
# reindex) before it is trusted. The limits are ceilings, not allocations:
# they sum to 17.5 GB and the expected resident set is 10 to 11 GB.
# Elasticsearch: heap 2g, about 3.4 GiB resident with 12k resources loaded
# (direct memory, metaspace, threads, page cache), hence a 5g limit.
# memswap_limit equals the memory limit everywhere: a container never swaps, a
# leaking one is killed and restarted instead of crawling.
services:
  postgres:
    command: ["postgres",
              "-c", "standard_conforming_strings=off",
              "-c", "max_connections=60",
              "-c", "shared_buffers=1GB",
              "-c", "effective_cache_size=3GB",
              "-c", "work_mem=16MB",
              "-c", "maintenance_work_mem=256MB",
              "-c", "autovacuum_work_mem=128MB",
              "-c", "random_page_cost=1.5",
              "-c", "jit=off"]
    shm_size: 1g
    deploy: {resources: {limits: {memory: 3g}}}
    memswap_limit: 3g

  elasticsearch:
    environment:
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      xpack.ml.enabled: "false"
    deploy: {resources: {limits: {memory: 5g}}}
    memswap_limit: 5g

  redis-broker:
    deploy: {resources: {limits: {memory: 256m}}}
    memswap_limit: 256m

  redis-cache:
    deploy: {resources: {limits: {memory: 768m}}}
    memswap_limit: 768m

  cantaloupe:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:+ExitOnOutOfMemoryError"
    deploy: {resources: {limits: {memory: 1792m}}}
    memswap_limit: 1792m

  web:
    environment:
      GUNICORN_WORKERS: "5"
      GUNICORN_THREADS: "4"
    deploy: {resources: {limits: {memory: 4g}}}
    memswap_limit: 4g

  worker:
    environment:
      CELERY_CONCURRENCY: "3"
    deploy: {resources: {limits: {memory: 2g}}}
    memswap_limit: 2g

  beat:
    deploy: {resources: {limits: {memory: 256m}}}
    memswap_limit: 256m

  nginx:
    # Process and buffers, plus the 256 MiB tmpfs of upload bodies (counted against the limit).
    deploy: {resources: {limits: {memory: 512m}}}
    memswap_limit: 512m

  # One-off backup runs: outside the steady-state budget above, like certbot.
  restic:
    deploy: {resources: {limits: {memory: 1g}}}
    memswap_limit: 1g
