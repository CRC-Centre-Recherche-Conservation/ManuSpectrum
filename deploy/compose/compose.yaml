# ManuSpectrum stack: the application (web, worker, beat), PostgreSQL/PostGIS,
# Elasticsearch, a Redis broker, a Redis cache, Cantaloupe and nginx. Security, health
# and persistence live here and apply everywhere; compose.prod.yaml adds the
# sizing of the production host. Always run both files together on a host
# (make -C deploy <target>). Only nginx publishes ports (HTTP_PORT and
# HTTPS_PORT, 80 and 443 by default).
#
# Data volumes are external: `make -C deploy volumes` creates them once, and
# no Compose command, `down -v` included, deletes them.
name: manuspectrum

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-monitoring: &monitoring
  <<: *service
  profiles: [observability]
  read_only: true
  tmpfs:
    - "/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"

x-media: &media
  type: bind
  source: ${MEDIA_HOST_DIR:?set MEDIA_HOST_DIR in .env}
  target: /srv/media
  bind:
    create_host_path: false

x-app: &app
  <<: *service
  image: ${MANUSPECTRUM_IMAGE:?set MANUSPECTRUM_IMAGE in .env}
  user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
  env_file:
    - path: .env
      required: true
  environment: &app_environment
    PGHOST: postgres
    PGPORT: "5432"
    PGPASSWORD_FILE: /run/secrets/pg_password
    ESHOST: elasticsearch
    ESPORT: "9200"
    ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
    MANUSPECTRUM_SECRET_KEY_FILE: /run/secrets/django_secret_key
    REDIS_BROKER_URL: redis://redis-broker:6379
    REDIS_CACHE_URL: redis://redis-cache:6379
    CANTALOUPE_HOST: cantaloupe
    CANTALOUPE_PORT: "8182"
    # 0: no statement or idle-in-transaction timeout; web alone sets them (settings_docker).
    PG_STATEMENT_TIMEOUT_MS: "0"
    PG_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
    EMAIL_HOST_PASSWORD_FILE: /run/secrets/email_password
  secrets: [pg_password, elastic_password, django_secret_key, email_password]
  read_only: true

services:
  postgres:
    <<: *service
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    command: ["postgres", "-c", "standard_conforming_strings=off"]
    environment:
      POSTGRES_USER: ${PGUSERNAME:?set PGUSERNAME in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    secrets: [pg_password]
    # The image entrypoint prepares the data directory as root, then drops to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Replaces the image's own 10_postgis.sh: template_postgis is created the Arches way.
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  elasticsearch:
    <<: *service
    image: elasticsearch:8.19.21@sha256:ae1f398ec8734a63eb7f719cecc2ea33e2bb46e23bdf24641dec86fd256bf594
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    secrets: [elastic_password]
    # The image refuses an ELASTIC_PASSWORD_FILE whose mode is not 400 or 600,
    # and the secret file is 0444 (read by several uids): the entrypoint gets
    # a 0600 copy. The image writes the password to its keystore in the same
    # container layer anyway. tini stays pid 1, as in the image.
    entrypoint:
      - /bin/tini
      - --
      - /bin/bash
      - -c
      - >-
        umask 077 && cat /run/secrets/elastic_password > /tmp/elastic_password
        && export ELASTIC_PASSWORD_FILE=/tmp/elastic_password
        && exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - bash
    command: ["eswrapper"]
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65535, hard: 65535}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u "elastic:$$(cat /run/secrets/elastic_password)"
          "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  redis-broker:
    <<: *service
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Celery broker (DB 0) and IIIF sign-ins (DB 3): never evicts, append-only file.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "",
              "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - redis_broker:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-cache:
    <<: *service
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Django caches: least-recently-used keys are evicted, nothing is persisted.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs: ["/data:rw,nosuid,nodev,size=16m"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cantaloupe:
    <<: *service
    # Reads the uploaded files, owned by APP_UID:APP_GID with group read access.
    group_add: ["${APP_GID:?set APP_GID in .env}"]
    image: uclalibrary/cantaloupe:5.0.7-2@sha256:76140291a6320626e4ba58ecae0937f39f6e21318ff62adc78215ae44fd094df
    environment:
      CANTALOUPE_BASE_URI: ${PUBLIC_SERVER_ADDRESS:?set PUBLIC_SERVER_ADDRESS in .env (https://host/, trailing slash)}iiifserver
      CANTALOUPE_ENDPOINT_ADMIN_ENABLED: "false"
      CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: /imageroot/
      CANTALOUPE_HTTP_ACCESSCONTROLALLOWORIGIN: "*"
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED: "true"
      CANTALOUPE_CACHE_SERVER_DERIVATIVE: FilesystemCache
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_TTL_SECONDS: "2592000"
      CANTALOUPE_CACHE_SERVER_INFO_ENABLED: "true"
      CANTALOUPE_FILESYSTEMCACHE_PATHNAME: /var/cache/cantaloupe
      CANTALOUPE_LOG_APPLICATION_CONSOLEAPPENDER_ENABLED: "true"
      CANTALOUPE_LOG_APPLICATION_ROLLINGFILEAPPENDER_ENABLED: "false"
      CANTALOUPE_LOG_ERROR_ROLLINGFILEAPPENDER_ENABLED: "false"
      # nginx writes the access log (JSON, rotated by age on the host); json-file only rotates by size.
      CANTALOUPE_LOG_ACCESS_CONSOLEAPPENDER_ENABLED: "false"
    volumes:
      - type: bind
        source: ${MEDIA_HOST_DIR:?set MEDIA_HOST_DIR in .env}/uploadedfiles
        target: /imageroot
        read_only: true
        bind:
          create_host_path: false
      - cantaloupe_cache:/var/cache/cantaloupe
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8182/iiif/3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    <<: *app
    command: ["web"]
    environment:
      <<: *app_environment
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-60000}
      PG_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${PG_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus
    secrets: [pg_password, elastic_password, django_secret_key, email_password, admin_password]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=1g"
      # Prometheus multiprocess files of the gunicorn workers (/metrics sums them). mode=1777: a tmpfs is recreated root-owned 0755 when
      # Docker restarts, and the application uid must still write to it.
      - "/run/prometheus:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    volumes:
      - *media
      - static:/srv/static
      - type: bind
        source: ${LOCAL_CA_CERT:-/dev/null}
        target: /run/ms-ca/ca.crt
        read_only: true
        bind:
          create_host_path: false
    # Above gunicorn's graceful_timeout (300 s): a recycled or stopped worker
    # lets its downloads finish.
    stop_grace_period: 310s
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: web", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # First installation only (`make -C deploy init`): setup_db, the admin password,
  # then the data package (the pkg submodule) mounted read-only. Not started by
  # `up`. load_package copies the package's System_Settings.json into
  # APP_ROOT/system_settings, which the read-only image cannot take: a tmpfs
  # stands there for this run (the image's own copy is not read, the package
  # carries the settings).
  init:
    <<: *app
    profiles: [init]
    restart: "no"
    command: ["init"]
    environment:
      <<: *app_environment
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [pg_password, elastic_password, django_secret_key, email_password, admin_password]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=1g"
      - "/app/manuspectrum/system_settings:rw,noexec,nosuid,nodev,size=8m,mode=1777"
    volumes:
      - *media
      - type: bind
        source: ${PKG_DIR:-../../pkg}
        target: /srv/pkg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_CA_CERT:-/dev/null}
        target: /run/ms-ca/ca.crt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      disable: true
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
      redis-cache: {condition: service_healthy}

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app_environment
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus
      # Served from the worker's main process, inside the Compose network only.
      MS_CELERY_METRICS_PORT: "9808"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=512m"
      - "/run/prometheus:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    volumes:
      - *media
      - type: bind
        source: ${LOCAL_CA_CERT:-/dev/null}
        target: /run/ms-ca/ca.crt
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 60s
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "env -u PROMETHEUS_MULTIPROC_DIR celery -A manuspectrum.celery inspect ping --destination \"celery@$${HOSTNAME}\" --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  beat:
    <<: *app
    command: ["beat"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    volumes:
      - beat:/var/lib/celery
    depends_on:
      web: {condition: service_healthy}
    # A singleton nobody waits on; the image's /healthz probe does not apply to it.
    healthcheck:
      disable: true

  nginx:
    <<: *service
    # nginx-unprivileged listens on 80 and 443 with no capability: Docker sets
    # net.ipv4.ip_unprivileged_port_start=0 in the container.
    # Runs as the service account, which owns the media files and the log directory.
    image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    read_only: true
    ports:
      - {target: 80, published: "${HTTP_PORT:-80}", protocol: tcp}
      - {target: 443, published: "${HTTPS_PORT:-443}", protocol: tcp}
    networks:
      # web and worker reach the public name through nginx (server-side info.json
      # fetch of Arches' manifest manager, which uses the public origin).
      default:
        aliases: ["${PUBLIC_HOST:?set PUBLIC_HOST in .env (the host name of PUBLIC_SERVER_ADDRESS)}"]
    environment:
      DOMAIN_NAMES: ${DOMAIN_NAMES:?set DOMAIN_NAMES in .env}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-3600}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_ENVSUBST_FILTER: ^(DOMAIN_NAMES|HSTS_MAX_AGE)$$
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=16m,mode=1777"
      # Request bodies of uploads (client_max_body_size 100m, two at once).
      - "/var/cache/nginx:rw,nosuid,nodev,size=256m,mode=1777"
    volumes:
      - {type: bind, source: ./nginx/nginx.conf, target: /etc/nginx/nginx.conf, read_only: true}
      - {type: bind, source: ./nginx/snippets, target: /etc/nginx/snippets, read_only: true}
      - {type: bind, source: ./nginx/templates, target: /etc/nginx/templates, read_only: true}
      - {type: bind, source: ./nginx/errors, target: /etc/nginx/errors, read_only: true}
      - {type: bind, source: ./nginx/ffdhe2048.pem, target: /etc/nginx/ffdhe2048.pem, read_only: true}
      # The site's own error page, shared with Django (self-contained).
      - {type: bind, source: ../../manuspectrum/templates/errors/500.htm, target: /etc/nginx/site-errors/500.htm, read_only: true}
      - type: bind
        source: ${CERTS_DIR:?set CERTS_DIR in .env}/live
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTS_DIR}/acme-webroot
        target: /var/www/acme
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_HOST_DIR:?set MEDIA_HOST_DIR in .env}
        target: /srv/media
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: static
        target: /srv/static
        read_only: true
      - type: bind
        source: ${NGINX_LOG_HOST_DIR:?set NGINX_LOG_HOST_DIR in .env}
        target: /var/log/manuspectrum
        bind:
          create_host_path: false
    depends_on:
      # The static files are published before gunicorn starts.
      web: {condition: service_healthy}
      cantaloupe: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Issues and renews the Let's Encrypt certificate (CERT_MODE=acme). Never
  # started by `up`: `make cert-init` and `make cert-renew` run it once per
  # call. It sees three subdirectories of CERTS_DIR and no more: the webroot
  # acme-webroot/, the account and lineages letsencrypt/ (never mounted into
  # nginx), and live/, where the deploy hook copies the lineage as
  # fullchain.pem and privkey.pem, the only files nginx reads.
  certbot:
    <<: *service
    profiles: [acme]
    restart: "no"
    # certbot/certbot v5.8.0
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    read_only: true
    entrypoint:
      - certbot
      - --config-dir=/certs/letsencrypt
      - --logs-dir=/certs/letsencrypt/logs
      - --work-dir=/tmp/certbot
    environment:
      HOME: /tmp
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=16m,mode=1777"
    volumes:
      - type: bind
        source: ${CERTS_DIR:?set CERTS_DIR in .env}/live
        target: /certs/live
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTS_DIR}/letsencrypt
        target: /certs/letsencrypt
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTS_DIR}/acme-webroot
        target: /certs/acme-webroot
        bind:
          create_host_path: false
      - {type: bind, source: ./certbot/deploy-hook.sh, target: /hooks/deploy-hook.sh, read_only: true}

  # Backups (deploy/BACKUP.md). Never started by `up`: backup.sh, restore-test.sh,
  # restore.sh and restore-files.sh run it once per call. No network; the
  # sources are read-only; the repository and /restic-tmp (temporary packs) are
  # the only writable mounts.
  restic:
    <<: *service
    profiles: [backup]
    restart: "no"
    # restic 0.19.1
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    read_only: true
    network_mode: none
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_HOST: manuspectrum
      HOME: /tmp
      # Temporary packs of a backup reach the size of the data in flight; /tmp is a small tmpfs.
      TMPDIR: /restic-tmp
    secrets: [restic_password]
    healthcheck:
      disable: true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=16m,mode=1777"
    volumes:
      - type: bind
        source: ${RESTIC_REPOSITORY_DIR:?set RESTIC_REPOSITORY_DIR in .env}
        target: /repo
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_DUMP_DIR:?set BACKUP_DUMP_DIR in .env}/tmp
        target: /restic-tmp
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_DUMP_DIR:?set BACKUP_DUMP_DIR in .env}/latest
        target: /backup/db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_HOST_DIR}
        target: /backup/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECRETS_DIR}
        target: /backup/secrets
        read_only: true
        bind:
          create_host_path: false

  # Monitoring (profile observability, on through COMPOSE_PROFILES in .env).
  # Prometheus, Alertmanager and Grafana share the `monitoring` network;
  # Grafana is on no other, so it cannot reach web, and it is published on the
  # loopback of the host only (reached through an SSH tunnel). No service
  # mounts the Docker socket.
  prometheus:
    <<: *monitoring
    # prometheus v3.15.0, read 2026-10-09
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=8GB
    networks: [default, monitoring]
    # The edge probe target comes from PUBLIC_HOST: the entrypoint writes it to
    # the tmpfs /tmp (the container stays read-only; an inline Compose config
    # cannot be mounted into a read-only service).
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env (the host name of PUBLIC_SERVER_ADDRESS)}
    volumes:
      - prometheus_data:/prometheus
      - {type: bind, source: ./observability/prometheus/entrypoint.sh, target: /etc/prometheus/entrypoint.sh, read_only: true}
      - {type: bind, source: ./observability/prometheus/prometheus.yml, target: /etc/prometheus/prometheus.yml, read_only: true}
      - {type: bind, source: ./observability/prometheus/rules, target: /etc/prometheus/rules, read_only: true}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  alertmanager:
    <<: *monitoring
    # alertmanager v0.34.1, read 2026-10-09
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    user: "65534:65534"
    # The configuration is rendered from the environment into /tmp at start.
    entrypoint: ["/bin/sh", "/etc/alertmanager/render.sh"]
    command:
      - --config.file=/tmp/alertmanager.yml
      - --storage.path=/alertmanager
      # A single instance: no gossip listener on the monitoring network.
      - --cluster.listen-address=
    networks: [monitoring]
    environment:
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/email_password
      ALERT_EMAILS: ${ALERT_EMAILS:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env (the host name of PUBLIC_SERVER_ADDRESS)}
    secrets: [email_password]
    volumes:
      - alertmanager_data:/alertmanager
      - {type: bind, source: ./observability/alertmanager, target: /etc/alertmanager, read_only: true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    <<: *monitoring
    # grafana 13.2.3, read 2026-10-09
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    user: "472:472"
    networks: [monitoring]
    ports:
      - {host_ip: 127.0.0.1, target: 3000, published: "3000", protocol: tcp}
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_LOG_MODE: console
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - {type: bind, source: ./observability/grafana/provisioning, target: /etc/grafana/provisioning, read_only: true}
      - {type: bind, source: ./observability/grafana/dashboards, target: /etc/grafana/dashboards, read_only: true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Reads the host through a read-only bind of `/` (rslave: the network
  # filesystem mounted after the container started shows up) and the textfile
  # directory of the backup metrics. The network collectors are off: the
  # container's network namespace is not the host's.
  node-exporter:
    <<: *monitoring
    # node_exporter v1.12.1, read 2026-10-09
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    user: "65534:65534"
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-timeout=5s
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: ${METRICS_TEXTFILE_DIR:?set METRICS_TEXTFILE_DIR in .env}
        target: /textfile
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Connects as the ms_monitor role (pg_monitor) to the postgres maintenance
  # database; pg_stat_statements is read without the query text.
  postgres-exporter:
    <<: *monitoring
    # postgres_exporter v0.20.1, read 2026-10-09
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    user: "65534:65534"
    command:
      - --collector.stat_statements
      - --no-collector.stat_statements.include_query
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ms_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_monitor_password
    secrets: [pg_monitor_password]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis-exporter:
    <<: *monitoring
    # redis_exporter v1.93.0 (alpine: the default image has no shell or wget), read 2026-10-09
    image: oliver006/redis_exporter:v1.93.0-alpine@sha256:93831cd4d5d67687de67c9d5221b14312fea580af8d157583ed9d4459bf2dd70
    user: "59000:59000"
    environment:
      REDIS_ADDR: redis://redis-broker:6379
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=celery
    depends_on:
      redis-broker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/"]
      interval: 30s
      timeout: 5s
      retries: 3

  blackbox-exporter:
    <<: *monitoring
    # blackbox_exporter v0.29.0, read 2026-10-09
    image: quay.io/prometheus/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    user: "65534:65534"
    volumes:
      - {type: bind, source: ./observability/blackbox/blackbox.yml, target: /etc/blackbox_exporter/config.yml, read_only: true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # CI and rehearsal only (profile mailpit): receives the alert and report
  # e-mails so that a run can prove they leave the stack. Not part of
  # COMPOSE_PROFILES on a production host.
  mailpit:
    <<: *service
    profiles: [mailpit]
    # mailpit v1.31.4, read 2026-10-09
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    user: "65534:65534"
    read_only: true
    networks: [default, monitoring]
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /tmp/mailpit.db
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

secrets:
  pg_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/pg_password
  elastic_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/elastic_password
  django_secret_key:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/django_secret_key
  # Optional content: empty means a relay without authentication.
  email_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/email_password
  # Password given to the Arches superuser `admin` by `init`; only web mounts it.
  admin_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/admin_password
  # Password of the restic repository; only the restic service mounts it.
  restic_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/restic_password
  # Administrator password of Grafana; only grafana mounts it.
  grafana_admin_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/grafana_admin_password
  # Password of the ms_monitor PostgreSQL role; only postgres-exporter mounts it.
  pg_monitor_password:
    file: ${SECRETS_DIR:?set SECRETS_DIR in .env}/pg_monitor_password

volumes:
  pg_data:
    external: true
    name: ms_pg_data
  es_data:
    external: true
    name: ms_es_data
  redis_broker:
    external: true
    name: ms_redis_broker
  cantaloupe_cache:
    external: true
    name: ms_cantaloupe_cache
  # Refilled from the image at every web start (publish-static).
  static: {}
  # Celery beat schedule: only the time of the last runs.
  beat: {}
  # Monitoring state, all derived data: never backed up. The Prometheus
  # database is external (local disk) and created by `make volumes`.
  prometheus_data:
    external: true
    name: ms_prometheus_data
  alertmanager_data: {}
  grafana_data: {}

networks:
  # Prometheus, Alertmanager and Grafana. Not internal: Alertmanager reaches
  # the SMTP relay through it. Grafana is on no other network.
  monitoring: {}
